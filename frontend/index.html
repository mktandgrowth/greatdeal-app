<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreatDeal · Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .fade-in { animation: fadeIn .3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .dropzone { transition: all 0.2s; border-style: dashed; }
  .dropzone.drag { background: #dbeafe; border-color: #3b82f6; transform: scale(1.02); }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .step-dot { transition: all 0.2s; }
  .section-card { transition: all 0.2s; }
  .section-card.complete { border-color: #10b981; background: #f0fdf4; }
  .clip-tile.sortable-ghost { opacity: 0.3; }
  .clip-tile.sortable-chosen { transform: scale(1.05); z-index: 10; }
  .editor-modal { position: fixed; inset: 0; background: rgba(15,23,42,0.97); z-index: 100; overflow-y: auto; }
  .editor-clip.sortable-ghost { opacity: 0.4; background: #1e40af; }
  .editor-clip.sortable-chosen { transform: scale(1.02); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .drag-handle { cursor: grab; touch-action: none; }
  .drag-handle:active { cursor: grabbing; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; background: #475569; border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #fbbf24; border-radius: 50%; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; background: #fbbf24; border-radius: 50%; cursor: pointer; border: none; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform 0.2s; }
  .mode-pill { transition: all 0.2s; }
  .mode-pill.active { background: #0f172a; color: white; }
  .dual-range { position: relative; height: 48px; margin: 8px 0; touch-action: none; }
  .dual-range .track-bg { position: absolute; top: 22px; left: 0; right: 0; height: 4px; background: #334155; border-radius: 2px; }
  .dual-range .track-sel { position: absolute; top: 22px; height: 4px; background: #fbbf24; border-radius: 2px; pointer-events: none; }
  .dual-range input[type="range"] { position: absolute; top: 0; left: 0; width: 100%; height: 48px; background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none; margin: 0; touch-action: pan-x; }
  .dual-range input[type="range"]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 32px; height: 32px; background: #fbbf24; border: 3px solid white; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.5); margin-top: -14px; touch-action: pan-x; }
  .dual-range input[type="range"]::-moz-range-thumb { pointer-events: auto; width: 32px; height: 32px; background: #fbbf24; border: 3px solid white; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.5); touch-action: pan-x; }
  .dual-range input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 4px; }
  .dual-range input[type="range"]::-moz-range-track { background: transparent; height: 4px; }
  .trim-preview-video { width: 100%; max-height: 220px; background: black; border-radius: 8px; }
  /* Mobile-friendly editor */
  .editor-modal { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .editor-clip input[type="range"]:not(.dual-range *) { height: 36px; touch-action: pan-x; }
  .editor-clip input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; touch-action: pan-x; }
  .editor-clip input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; touch-action: pan-x; }
  /* Prevent text selection during drag in editor */
  .editor-clip { -webkit-user-select: none; user-select: none; }
  .editor-clip input, .editor-clip textarea { -webkit-user-select: text; user-select: text; }
  .ai-badge { background: linear-gradient(90deg, #a855f7, #ec4899); color: white; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold">G</div>
      <span class="font-bold text-slate-900">GreatDeal</span>
    </div>
    <button onclick="resetAll()" class="text-xs text-slate-500 hover:text-slate-900">Empezar de nuevo</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 pb-32">
  <div class="pt-6 mb-6">
    <div class="flex items-center justify-center gap-3 flex-wrap" id="stepper"></div>
  </div>
  <div id="step-content"></div>
</main>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-20">
  <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
    <button id="btn-prev" onclick="goPrev()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg disabled:opacity-30">← Volver</button>
    <button id="btn-next" onclick="goNext()" class="px-6 py-3 bg-slate-900 text-white rounded-lg hover:bg-slate-800 disabled:opacity-30 font-medium">Continuar →</button>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────
const STEPS = [
  { id: 1, label: "Videos" },
  { id: 2, label: "Datos" },
  { id: 3, label: "Audio" },
  { id: 4, label: "Tu reel" },
];

const SECTION_ORDER = ["exterior", "entrada", "dormitorios", "banos", "areas", "vista"];

const SECTION_CONFIG = {
  exterior: { label: "Exterior", icon: "🏡", description: "Una toma del lugar desde afuera. Mostrá la fachada completa con luz natural.", tip: "Celular vertical, distancia que se vea el lugar entero. 3-4 segundos.", minClips: 0, maxClips: 1, defaultDuration: 3.5, speed: 1.0, defaultHeadline: "" },
  entrada: { label: "Entrada", icon: "🚪", description: "Grabá ~15 segundos caminando hacia y entrando al lugar. Lo aceleramos 3x.", tip: "Caminá firme y lento, celular vertical. Desde afuera hasta el living.", minClips: 0, maxClips: 1, defaultDuration: 15, speed: 3.0, defaultHeadline: "" },
  dormitorios: { label: "Dormitorios", icon: "🛏️", description: "1 a 5 panorámicas de cada dormitorio. 2.5 segundos cada toma.", tip: "Parate en un extremo y barré con el celular hacia el otro lado, fluído. Camas hechas.", minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0, defaultHeadline: "Dormitorios" },
  banos: { label: "Baños", icon: "🚿", description: "1 a 5 tomas cortas de baños. 2.5 seg cada una.", tip: "Panorámica o detalle de la grifería. Sin objetos personales.", minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0, defaultHeadline: "Baños" },
  areas: { label: "Áreas comunes", icon: "🛋️", description: "1 a 5 tomas de living, cocina, terraza, comedor. 2.5 seg cada una.", tip: "Ángulos amplios. Encendé luces y abrí cortinas para más luminosidad.", minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0, defaultHeadline: "Áreas comunes" },
  vista: { label: "Vista", icon: "🌅", description: "Cierre con la vista del lugar. 3 segundos.", tip: "Vista exterior (mar, cordillera, ciudad) desde la mejor ventana o terraza.", minClips: 0, maxClips: 1, defaultDuration: 3, speed: 1.0, defaultHeadline: "" },
};

const API_BASE = (() => {
  const host = window.location.hostname;
  if (host === "localhost" || host === "127.0.0.1") return "";
  return window.GREATDEAL_API_URL || "https://greatdeal-api.onrender.com";
})();
const API = (path) => `${API_BASE}/api${path}`;

// Fetch wrapper con mensajes de error útiles (sobre todo en móvil)
async function fetchWithDetail(url, opts) {
  try {
    const resp = await fetch(url, opts);
    return resp;
  } catch (e) {
    // "Failed to fetch" típico = network error o CORS
    const msg = String(e.message || e);
    const isOffline = !navigator.onLine;
    const detail = [
      `Error de red: ${msg}`,
      isOffline ? "📴 Estás sin conexión." : "📡 Verificá tu conexión a internet.",
      `URL: ${url}`,
      `Tip: si estás en red móvil, probá con WiFi. Las redes móviles a veces bloquean uploads grandes.`,
    ].join("\n");
    const err = new Error(detail);
    err.isNetworkError = true;
    throw err;
  }
}

function calcAutoDuration(n) {
  if (n === 0) return 3;
  return Math.max(1.8, Math.min(5, 26 / n));
}

// ── STATE ──────────────────────────────────────────────────────────
function emptySections() {
  const s = {};
  for (const k of SECTION_ORDER) s[k] = { clips: [], headline: SECTION_CONFIG[k].defaultHeadline };
  return s;
}

let state = {
  step: 1,
  upload_mode: "guided",
  sections: emptySections(),
  simple_clips: [],
  property: { tipo: "Casa", comuna: "", m2: "", dorms: "", banos: "", precio_uf: "" },
  advanced_open: false,
  enhance_ai: false,
  auto_subtitles: false,
  music_preset: "chill",
  music_file: null,
  music_presets_catalog: [],
  voice_audio_file: null,
  voice_audio_url: null,
  voice_method: "none",
  voice_script: "",
  voice_eleven_key: "",
  eleven_voices: [],
  is_recording: false,
  media_recorder: null,
  recorded_chunks: [],
  is_generating_voice: false,
  logo_file: null,
  logo_dataUrl: null,
  custom_tagline: "Vivir distinto",
  custom_cta_info: "",
  custom_cta_precio: "",
  job_id: null, job_status: null, job_log: [], job_error: null,
  job_download: null, job_duration: null,
  is_reprocessing: false, has_been_processed: false,
  editor_open: false, editor_clips: [], editor_sortable: null, simple_sortable: null,
  // Runway AI per-clip regeneration
  runway_modal_open: false,
  runway_active_clip_id: null,
  runway_prompt: "",
  runway_preset_key: "luz_natural",
  runway_presets: [],
  runway_available: false,
  runway_task_id: null,
  runway_task_status: null,
  runway_task_error: null,
  runway_cost_estimate: 0,
  runway_replaced_clips: {},  // map: clip_id -> {url, blob, file}
};

function resetAll() {
  if (!confirm("¿Empezar de cero? Se pierden los videos cargados.")) return;
  const catalog = state.music_presets_catalog;
  const voices = state.eleven_voices;
  state = {
    step: 1, upload_mode: "guided", sections: emptySections(), simple_clips: [],
    property: { tipo: "Casa", comuna: "", m2: "", dorms: "", banos: "", precio_uf: "" },
    advanced_open: false, enhance_ai: false, auto_subtitles: false,
    music_preset: "chill", music_file: null, music_presets_catalog: catalog,
    voice_audio_file: null, voice_audio_url: null, voice_method: "none",
    voice_script: "", voice_eleven_key: "", eleven_voices: voices,
    is_recording: false, media_recorder: null, recorded_chunks: [], is_generating_voice: false,
    logo_file: null, logo_dataUrl: null,
    custom_tagline: "Vivir distinto", custom_cta_info: "", custom_cta_precio: "",
    job_id: null, job_status: null, job_log: [], job_error: null,
    job_download: null, job_duration: null,
    is_reprocessing: false, has_been_processed: false,
    editor_open: false, editor_clips: [], editor_sortable: null, simple_sortable: null,
  };
  render();
}

// ── HELPERS ────────────────────────────────────────────────────────
function escapeHtml(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escapeAttr(s) { return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;"); }

function totalClipsCount() {
  if (state.upload_mode === "simple") return state.simple_clips.length;
  return SECTION_ORDER.reduce((acc, k) => acc + state.sections[k].clips.length, 0);
}

function switchUploadMode(mode) {
  if (mode === state.upload_mode) return;
  if (totalClipsCount() > 0) {
    if (!confirm("Si cambiás de modo se pierden los videos cargados. ¿Seguir?")) return;
    state.sections = emptySections();
    state.simple_clips = [];
  }
  state.upload_mode = mode;
  render();
}

async function loadMusicPresets() {
  try {
    const r = await fetch(API("/music-presets"));
    const j = await r.json();
    state.music_presets_catalog = j.presets || [];
  } catch (e) { console.warn("Music presets:", e); }
}

async function loadElevenVoices() {
  try {
    const r = await fetch(API("/voices"));
    const j = await r.json();
    state.eleven_voices = j.voices || [];
    if (!state.voice_eleven_key && state.eleven_voices.length) {
      state.voice_eleven_key = state.eleven_voices[0].key || state.eleven_voices[0].id || "";
    }
  } catch (e) { console.warn("Eleven voices:", e); }
}

async function loadRunwayPresets() {
  try {
    const r = await fetch(API("/runway/presets"));
    const j = await r.json();
    state.runway_presets = j.presets || [];
    state.runway_available = !!j.available;
  } catch (e) { console.warn("Runway presets:", e); state.runway_available = false; }
}

// ── RUNWAY AI por toma ────────────────────────────────────────────
function openRunwayModal(clipId) {
  const c = state.editor_clips.find(x => x.id === clipId);
  if (!c) return;
  state.runway_active_clip_id = clipId;
  state.runway_prompt = "";
  state.runway_preset_key = state.runway_presets[0]?.key || "luz_natural";
  state.runway_task_id = null;
  state.runway_task_status = null;
  state.runway_task_error = null;
  state.runway_cost_estimate = Math.round((c.trim_duration / c.speed) * 0.05 * 100) / 100;
  state.runway_modal_open = true;
  render();
}

function closeRunwayModal() {
  state.runway_modal_open = false;
  state.runway_active_clip_id = null;
  render();
}

function selectRunwayPreset(key) {
  const p = state.runway_presets.find(x => x.key === key);
  if (!p) return;
  state.runway_preset_key = key;
  state.runway_prompt = p.prompt;
  render();
}

async function runwayGenerate() {
  const c = state.editor_clips.find(x => x.id === state.runway_active_clip_id);
  if (!c) return;
  if (!state.runway_prompt.trim()) { alert("Escribí o elegí un prompt"); return; }
  if (!state.runway_available) {
    alert("Runway no está configurada en el server. Pedile a Vale que agregue RUNWAY_API_KEY en Render.");
    return;
  }

  // Round duration to integer for Runway (2-10s)
  const dur = Math.max(2, Math.min(10, Math.round(c.trim_duration / c.speed)));

  // Fetch the source clip as a blob (it's already a blob URL or file)
  let clipBlob;
  try {
    if (c.dataUrl.startsWith('blob:')) {
      const resp = await fetch(c.dataUrl);
      clipBlob = await resp.blob();
    } else {
      // data URL
      const resp = await fetch(c.dataUrl);
      clipBlob = await resp.blob();
    }
  } catch (e) {
    alert("Error preparando el clip: " + e.message);
    return;
  }

  const fd = new FormData();
  fd.append("clip", clipBlob, c.fileName || "clip.mp4");
  fd.append("prompt", state.runway_prompt);
  fd.append("model", "gen3a_turbo");
  fd.append("duration", String(dur));

  state.runway_task_status = "uploading";
  state.runway_task_error = null;
  render();

  try {
    const r = await fetch(API("/runway/enhance-clip"), { method: "POST", body: fd });
    if (!r.ok) {
      const t = await r.text();
      throw new Error(`HTTP ${r.status} — ${t.slice(0, 300)}`);
    }
    const j = await r.json();
    state.runway_task_id = j.task_id;
    state.runway_task_status = j.status;
    render();
    runwayPollTask();
  } catch (e) {
    state.runway_task_status = "error";
    state.runway_task_error = e.message || String(e);
    render();
  }
}

async function runwayPollTask() {
  if (!state.runway_task_id) return;
  while (state.runway_task_id) {
    await new Promise(r => setTimeout(r, 4000));
    if (!state.runway_modal_open) return;  // user closed modal
    try {
      const r = await fetch(API(`/runway/tasks/${state.runway_task_id}`));
      const j = await r.json();
      state.runway_task_status = j.status;
      state.runway_task_error = j.error;
      render();
      if (j.status === "done") {
        // Download the regenerated clip
        const dlUrl = `${API_BASE}${j.download_url}`;
        const dlResp = await fetch(dlUrl);
        const blob = await dlResp.blob();
        const blobUrl = URL.createObjectURL(blob);
        const file = new File([blob], `runway_${state.runway_active_clip_id}.mp4`, { type: "video/mp4" });
        applyRunwayResult(state.runway_active_clip_id, file, blobUrl);
        return;
      }
      if (j.status === "error") return;
    } catch (e) {
      console.warn("Poll error:", e);
      break;
    }
  }
}

function applyRunwayResult(clipId, file, blobUrl) {
  const c = state.editor_clips.find(x => x.id === clipId);
  if (!c) return;
  // Save backup of original (in case user wants to revert)
  if (!state.runway_replaced_clips[clipId]) {
    state.runway_replaced_clips[clipId] = {
      original_dataUrl: c.dataUrl,
      original_fileName: c.fileName,
    };
  }
  // Free old blob URL
  if (c.dataUrl.startsWith('blob:')) URL.revokeObjectURL(c.dataUrl);
  c.dataUrl = blobUrl;
  c.fileName = file.name;
  c._runwayFile = file;  // marker to know we need to upload this on reprocess
  c.sourceDuration = null;  // re-detect from new video
  state.runway_modal_open = false;
  render();
  setTimeout(initEditorSortable, 50);
  setTimeout(() => alert("✓ Toma regenerada con IA. Si te gusta, dale 'Re-procesar' arriba para incluirla en el reel."), 100);
}

function revertRunwayClip(clipId) {
  const backup = state.runway_replaced_clips[clipId];
  const c = state.editor_clips.find(x => x.id === clipId);
  if (!backup || !c) return;
  if (!confirm("¿Volver a la toma original (descartar la versión IA)?")) return;
  if (c.dataUrl.startsWith('blob:')) URL.revokeObjectURL(c.dataUrl);
  c.dataUrl = backup.original_dataUrl;
  c.fileName = backup.original_fileName;
  delete c._runwayFile;
  delete state.runway_replaced_clips[clipId];
  render();
  setTimeout(initEditorSortable, 50);
}

function renderRunwayModal() {
  const c = state.editor_clips.find(x => x.id === state.runway_active_clip_id);
  if (!c) return "";
  const presetsHtml = state.runway_presets.map(p => `
    <button onclick="selectRunwayPreset('${p.key}')" class="text-left p-2 rounded ${state.runway_preset_key === p.key ? 'bg-purple-600 text-white' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'} text-xs">
      ${escapeHtml(p.label)}
    </button>
  `).join("");

  const isProcessing = state.runway_task_status && state.runway_task_status !== "done" && state.runway_task_status !== "error";
  const isError = state.runway_task_status === "error";

  let actionArea = "";
  if (isProcessing) {
    actionArea = `
      <div class="bg-slate-700 border border-slate-600 rounded-xl p-4 text-center">
        <div class="spinner w-8 h-8 border-4 border-slate-500 border-t-purple-400 rounded-full mx-auto mb-3"></div>
        <div class="text-white font-medium">Runway está regenerando…</div>
        <div class="text-xs text-slate-400 mt-1">Status: ${escapeHtml(state.runway_task_status)} · 30-90 seg</div>
        <div class="text-[10px] text-slate-500 mt-2">No cierres el modal o se cancela el polling</div>
      </div>
    `;
  } else if (isError) {
    actionArea = `
      <div class="bg-red-900/40 border border-red-700 rounded-xl p-4">
        <div class="text-red-200 font-medium mb-1">✗ Error</div>
        <div class="text-xs text-red-300 break-words mb-3">${escapeHtml(state.runway_task_error || "Unknown")}</div>
        <button onclick="state.runway_task_status=null; state.runway_task_error=null; render()" class="px-3 py-1.5 bg-amber-500 text-slate-900 rounded text-xs">Reintentar</button>
      </div>
    `;
  } else {
    actionArea = `
      <button onclick="runwayGenerate()" ${!state.runway_available ? 'disabled' : ''} class="w-full px-4 py-3 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed">
        ✨ Generar con Runway (~$${state.runway_cost_estimate})
      </button>
      ${!state.runway_available ? '<div class="text-xs text-red-300 mt-2 text-center">⚠ RUNWAY_API_KEY no configurada en el server</div>' : ''}
    `;
  }

  return `
    <div class="editor-modal" style="background: rgba(0,0,0,0.85);">
      <div class="max-w-lg mx-auto px-4 py-6">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5">
          <div class="flex items-center justify-between mb-4">
            <div>
              <div class="text-white font-bold text-lg">✨ Rehacer con IA</div>
              <div class="text-xs text-slate-400">Clip: ${escapeHtml(c.fileName)} · ~${(c.trim_duration / c.speed).toFixed(1)}s</div>
            </div>
            <button onclick="closeRunwayModal()" class="text-slate-300 hover:text-white text-2xl leading-none">×</button>
          </div>

          <video src="${c.dataUrl}" muted playsinline controls class="w-full rounded-lg bg-black mb-4" style="max-height: 240px;"></video>

          <div class="mb-3">
            <label class="text-xs text-slate-400 block mb-2">Estilos rápidos:</label>
            <div class="grid grid-cols-2 gap-2">${presetsHtml || '<div class="text-xs text-slate-500">Sin presets</div>'}</div>
          </div>

          <div class="mb-4">
            <label class="text-xs text-slate-400 block mb-1">Tu instrucción:</label>
            <textarea rows="3" maxlength="500"
                      oninput="state.runway_prompt=this.value; updateRunwayPromptCounter()"
                      class="w-full px-3 py-2 bg-slate-900 border border-slate-700 text-white text-sm rounded"
                      placeholder="Ej: misma cocina pero con abundante luz natural entrando por la ventana, estilo cinematográfico">${escapeHtml(state.runway_prompt)}</textarea>

function estimateReelDuration() {
  let total = 0;
  if (state.upload_mode === "simple") {
    const n = state.simple_clips.length;
    total = n > 0 ? calcAutoDuration(n) * n : 0;
  } else {
    for (const k of SECTION_ORDER) {
      const cfg = SECTION_CONFIG[k];
      state.sections[k].clips.forEach(() => { total += cfg.defaultDuration / cfg.speed; });
    }
  }
  total += 5;
  if (state.logo_file) total += 2;
  return total;
}

function recommendedChars(d) {
  return { min: Math.round(d * 12), ideal: Math.round(d * 14), max: Math.round(d * 16) };
}

// ── VOICE: recording + Eleven generation ───────────────────────────
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    state.media_recorder = mr;
    state.recorded_chunks = [];
    mr.ondataavailable = e => { if (e.data.size > 0) state.recorded_chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(state.recorded_chunks, { type: mr.mimeType || 'audio/webm' });
      const ext = (mr.mimeType || '').includes('mp4') ? 'm4a' : 'webm';
      state.voice_audio_file = new File([blob], `voz_grabada.${ext}`, { type: mr.mimeType || 'audio/webm' });
      if (state.voice_audio_url) URL.revokeObjectURL(state.voice_audio_url);
      state.voice_audio_url = URL.createObjectURL(blob);
      stream.getTracks().forEach(t => t.stop());
      state.is_recording = false;
      state.media_recorder = null;
      render();
    };
    mr.start();
    state.is_recording = true;
    render();
  } catch (e) { alert("No se pudo acceder al micrófono: " + e.message); }
}

function stopRecording() {
  if (state.media_recorder && state.is_recording) state.media_recorder.stop();
}

async function generateVoiceWithEleven() {
  if (!state.voice_script.trim()) { alert("Escribí el guion primero"); return; }
  if (!state.voice_eleven_key) { alert("Elegí una voz"); return; }
  state.is_generating_voice = true;
  render();
  try {
    const fd = new FormData();
    fd.append("script", state.voice_script);
    fd.append("voice_key", state.voice_eleven_key);
    const r = await fetch(API("/generate-voice"), { method: "POST", body: fd });
    if (!r.ok) { const t = await r.text(); throw new Error(`HTTP ${r.status} — ${t.slice(0, 300)}`); }
    const blob = await r.blob();
    state.voice_audio_file = new File([blob], "voz_eleven.mp3", { type: "audio/mpeg" });
    if (state.voice_audio_url) URL.revokeObjectURL(state.voice_audio_url);
    state.voice_audio_url = URL.createObjectURL(blob);
  } catch (e) {
    alert("Error generando voz: " + e.message);
  } finally {
    state.is_generating_voice = false;
    render();
  }
}

function updateRunwayPromptCounter() {
  const el = document.getElementById("runway-prompt-counter");
  if (!el) return;
  const len = (state.runway_prompt || "").length;

function clearVoice() {
  if (state.voice_audio_url) URL.revokeObjectURL(state.voice_audio_url);

function renderStepper() {
  const html = STEPS.map((s, i) => {
    const active = state.step === s.id;
    const done = state.step > s.id;
    return `
      <div class="flex items-center gap-2">
        <div class="step-dot w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${active ? 'bg-slate-900 text-white' : done ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500'}">${done ? '✓' : s.id}</div>
        <span class="text-sm ${active ? 'text-slate-900 font-medium' : 'text-slate-500'}">${s.label}</span>
      </div>
      ${i < STEPS.length - 1 ? '<div class="w-8 h-px bg-slate-300"></div>' : ''}
    `;
  }).join("");
  document.getElementById("stepper").innerHTML = html;

  document.getElementById("btn-prev").disabled = (state.step === 1);
  const next = document.getElementById("btn-next");
  if (state.step === 4) {
    const isProc = state.job_status && state.job_status !== "done" && state.job_status !== "error";
    if (isProc) { next.textContent = "Procesando…"; next.disabled = true; }
    else if (!state.has_been_processed) { next.textContent = "Generar mi reel →"; next.disabled = false; }
    else { next.textContent = "✓ Listo"; next.disabled = true; }
  } else if (state.step === 1) {
    next.textContent = "Continuar →";
    next.disabled = totalClipsCount() === 0;
  } else {
    next.textContent = "Continuar →";
    next.disabled = false;
  }
}

function goNext() {
  if (state.step === 1 && totalClipsCount() === 0) { alert("Subí al menos un video"); return; }
  if (state.step === 4 && !state.has_been_processed) { processReel(); return; }
  if (state.step < STEPS.length) { state.step++; render(); }
}

function goPrev() { if (state.step > 1) { state.step--; render(); } }

function handleSimpleUpload(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith("video/"));
  if (arr.length === 0) return;
  let pending = arr.length;
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      state.simple_clips.push({ id: `s_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`, file: f, dataUrl: e.target.result, name: f.name });
      pending--;
      if (pending === 0) { render(); setTimeout(initSimpleSortable, 50); }
    };
    reader.readAsDataURL(f);
  });
}

function removeSimpleClip(id) {
  state.simple_clips = state.simple_clips.filter(c => c.id !== id);
  render();
  setTimeout(initSimpleSortable, 50);
}

function initSimpleSortable() {
  const grid = document.getElementById("simple-clips-grid");
  if (!grid || typeof Sortable === "undefined") return;
  if (state.simple_sortable) state.simple_sortable.destroy();
  state.simple_sortable = Sortable.create(grid, {
    animation: 150, ghostClass: "sortable-ghost", chosenClass: "sortable-chosen",
    onEnd: (evt) => {
      const moved = state.simple_clips.splice(evt.oldIndex, 1)[0];
      state.simple_clips.splice(evt.newIndex, 0, moved);
      grid.querySelectorAll(".clip-tile").forEach((tile, i) => {
        const badge = tile.querySelector("div");
        if (badge) badge.textContent = i + 1;
      });
    }
  });
}

  const limitTag = `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full ml-1">${cfg.maxClips === 1 ? `1 toma · ${cfg.defaultDuration}s` : `máx ${cfg.maxClips} · ${cfg.defaultDuration}s c/u`}</span>`;
  const clipsHtml = sec.clips.length === 0 ? "" : `
    <div class="flex flex-wrap gap-2 mb-3">
      ${sec.clips.map((c, i) => `

        </div>
      `).join("")}
    </div>
  `;
  const actionButtons = slotsLeft > 0 ? `
    <div class="flex flex-wrap gap-2">
      <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 text-white text-xs rounded-lg cursor-pointer hover:bg-slate-800">

      <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-900 text-slate-900 text-xs rounded-lg cursor-pointer hover:bg-slate-100">
        📷 Grabar
        <input type="file" accept="video/*" capture="environment" class="hidden" onchange="handleSectionUpload('${key}', event.target.files)">
      </label>
    </div>
  ` : `<span class="text-xs text-emerald-700 font-medium">✓ Sección completa</span>`;
  return `
    <div class="section-card border-2 ${complete ? 'complete' : 'border-slate-200'} rounded-xl p-4 bg-white">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center flex-wrap">
          <span class="text-xl mr-2">${cfg.icon}</span>
          <h3 class="font-bold text-slate-900">${cfg.label}</h3>
          ${limitTag}${speedTag}
        </div>
        <div class="text-xs ${complete ? 'text-emerald-600' : 'text-slate-400'} font-medium">${count}/${cfg.maxClips}</div>
      </div>
      <p class="text-xs text-slate-700 mb-1">${escapeHtml(cfg.description)}</p>
      <p class="text-[11px] text-slate-500 italic mb-3">💡 ${escapeHtml(cfg.tip)}</p>
      ${clipsHtml}
      ${actionButtons}
    </div>
  `;
}

function handleSectionUpload(key, files) {
  const cfg = SECTION_CONFIG[key];
  const sec = state.sections[key];
  const slotsLeft = cfg.maxClips - sec.clips.length;
  const arr = Array.from(files).filter(f => f.type.startsWith("video/")).slice(0, slotsLeft);
  let pending = arr.length;
  if (pending === 0) return;
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      sec.clips.push({ id: `g_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`, file: f, dataUrl: e.target.result, name: f.name });
      pending--;
      if (pending === 0) render();
    };
    reader.readAsDataURL(f);
  });
}

function removeSectionClip(key, idx) {
  state.sections[key].clips.splice(idx, 1);
  render();
}

function setVoiceMethod(method) {
  if (method !== state.voice_method && state.voice_audio_file) {
    if (!confirm("Hay una voz cargada. ¿Cambiar de método? (se borra la voz actual)")) return;
    clearVoice();
  }
  if (method === "none") clearVoice();
  state.voice_method = method;
  render();
}

// ── VOICE POST-PRODUCTION (después de tener el reel listo) ────────

      ${state.is_recording ? `<div class="bg-red-50 border-2 border-red-300 rounded-lg p-4 text-center mb-3"><div class="flex items-center justify-center gap-2 mb-2"><div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div><span class="text-red-700 font-bold">Grabando…</span></div><button onclick="stopRecording()" class="px-6 py-2 bg-red-600 text-white rounded-lg font-medium">⏹ Detener grabación</button></div>` : `<button onclick="startRecording()" class="w-full px-6 py-3 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800">${state.voice_audio_file ? '🎤 Volver a grabar' : '🎤 Empezar a grabar'}</button>`}

    const voiceOptions = state.eleven_voices.map(v => {
      const key = v.key || v.id || "";
      const label = v.label || v.name || key;

      </div>

        ✨ Aplicar voz al reel y re-procesar
      </button>
      ${(!state.voice_audio_file || state.voice_method === 'none') ? '<div class="text-[10px] text-slate-500 text-center mt-2">Primero cargá una voz (subir / grabar / generar IA)</div>' : ''}
    </div>
  `;
}

function updateCharCounter() {
  const realDur = state.job_duration || estimateReelDuration();
  const chars = recommendedChars(realDur);
  const currentChars = (state.voice_script || "").length;
  const el = document.getElementById("voice-char-status");
  if (!el) return;
  if (currentChars === 0) {
    el.innerHTML = `<span class="text-slate-500">${currentChars} / ${chars.ideal} caracteres ideal</span>`;
  } else if (currentChars > chars.max) {
    el.innerHTML = `<span class="text-red-600 font-bold">⚠ ${currentChars} chars · Te pasaste por ${currentChars - chars.max} chars (va a sonar lento o cortado)</span>`;
  } else if (currentChars < chars.min) {
    el.innerHTML = `<span class="text-amber-600 font-medium">${currentChars} chars · Faltan ${chars.min - currentChars} (la voz va a sonar muy rápida o con silencios)</span>`;
  } else {
    el.innerHTML = `<span class="text-emerald-600 font-medium">✓ ${currentChars} chars · Calza bien con la duración del reel</span>`;
  }
}

async function applyVoiceToReel() {
  if (!state.voice_audio_file) { alert("Cargá una voz primero"); return; }
  if (!state.job_id) { alert("No hay reel para aplicarle voz"); return; }
  if (!confirm("¿Aplicar la voz al reel y re-procesar? Toma 1-2 minutos.")) return;

  // Build sections from current state (no changes to clips)
  const { sections } = buildPayload();
  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "chill");
  fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
  fd.append("voice_audio", state.voice_audio_file);

  state.job_status = "reprocessing";
  state.is_reprocessing = true;
  state.job_log = [];
  state.job_error = null;
  state.job_download = null;
  render();

  try {
    const r = await fetchWithDetail(API(`/jobs/${state.job_id}/reprocess`), { method: "POST", body: fd });
    if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
    pollJobStatus();
  } catch (e) {
    state.job_status = "error";
    state.job_error = e.message || String(e);
    render();
  }
}

function handleVoiceUpload(file) {
  if (!file) return;
  if (state.voice_audio_url) URL.revokeObjectURL(state.voice_audio_url);
  state.voice_audio_file = file;
  state.voice_audio_url = URL.createObjectURL(file);
  render();
}

// ── STEP 4: TU REEL ────────────────────────────────────────────────

  const isDone = state.job_status === "done";

    return `
      <div class="fade-in max-w-md mx-auto text-center pt-12">

        ${renderVoicePostProduction()}

        <details class="bg-slate-50 rounded-xl px-4 py-3 text-sm">

            <button onclick="state.step=2; render()" class="px-3 py-1.5 bg-white border border-slate-300 rounded text-xs">📝 Cambiar datos</button>
            <button onclick="state.step=3; render()" class="px-3 py-1.5 bg-white border border-slate-300 rounded text-xs">🎵 Cambiar audio</button>
            <button onclick="state.step=2; state.advanced_open=true; render()" class="px-3 py-1.5 bg-white border border-slate-300 rounded text-xs">🏷️ Logo / CTA</button>

          </div>

      </div>`;
  }
  return `
    <div class="fade-in max-w-md mx-auto text-center pt-12">
      <div class="text-5xl mb-4">🚀</div>

      <p class="text-slate-600 mb-6">Tocá <strong>Generar mi reel</strong> abajo. Toma 1-2 minutos.</p>
      ${state.enhance_ai ? '<div class="bg-purple-50 border border-purple-200 rounded-xl p-3 text-sm text-purple-900">✨ Mejora IA activada — color y nitidez pro automáticos</div>' : ''}
    </div>`;
}

// ── PROCESS / REPROCESS ────────────────────────────────────────────
function buildCtaData() {
  const p = state.property;
  return {
    info: (state.custom_cta_info || "").trim() || `${p.m2 || '—'} m² · ${p.dorms || '—'} dorm · ${p.banos || '—'} baños`,
    precio: (state.custom_cta_precio || "").trim() || (p.precio_uf ? `Desde ${p.precio_uf} UF` : 'Consultar'),
    tagline: (state.custom_tagline || "").trim() || "Vivir distinto",
  };
}

function buildPayload() {
  if (state.upload_mode === "simple") {
    const dur = calcAutoDuration(state.simple_clips.length);
    const files = state.simple_clips.map(c => c.file);
    const sections = [{ name: "default", clips: state.simple_clips.map((_, i) => ({ file_index: i, trim_start: 0, trim_duration: dur, speed: 1.0, headline: "", subline: "" })) }];
    return { files, sections };
  }
  const files = [];
  const sections = [];
  for (const key of SECTION_ORDER) {
    const cfg = SECTION_CONFIG[key];
    const sec = state.sections[key];
    if (sec.clips.length === 0) continue;
    const clips = sec.clips.map((c, i) => { const fi = files.length; files.push(c.file); return { file_index: fi, trim_start: 0, trim_duration: cfg.defaultDuration, speed: cfg.speed, headline: i === 0 ? ((sec.headline || "").trim()) : "", subline: "" }; });
    sections.push({ name: key, clips });
  }
  return { files, sections };
}

async function processReel() {
  const { files, sections } = buildPayload();
  if (files.length === 0) { alert("No hay videos para procesar"); state.step = 1; render(); return; }
  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "chill");
  fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
  files.forEach(f => fd.append("clips", f));
  if (state.music_file) fd.append("music", state.music_file);
  if (state.voice_audio_file) fd.append("voice_audio", state.voice_audio_file);
  if (state.logo_file) fd.append("logo", state.logo_file);
  state.job_status = "uploading";
  state.is_reprocessing = false;
  state.has_been_processed = true;
  state.job_error = null;
  state.job_log = [];
  render();
  try {
    const r = await fetchWithDetail(API("/jobs"), { method: "POST", body: fd });
    if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
    const j = await r.json();
    state.job_id = j.job_id;
    state.job_status = j.status;
    render();
    pollJobStatus();
  } catch (e) { state.job_status = "error"; state.job_error = e.message || String(e); render(); }
}

async function reprocessFromCurrent() {
  if (!state.job_id) { processReel(); return; }
  if (!confirm("¿Re-procesar el reel con los cambios?")) return;
  const { sections } = buildPayload();
  if (sections.length === 0) { alert("No hay videos"); return; }
  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "chill");
  fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
  state.job_status = "reprocessing";
  state.is_reprocessing = true;
  state.job_log = [];
  state.job_error = null;
  state.job_download = null;
  render();
  try {
    const r = await fetchWithDetail(API(`/jobs/${state.job_id}/reprocess`), { method: "POST", body: fd });
    if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
    pollJobStatus();
  } catch (e) { state.job_status = "error"; state.job_error = e.message || String(e); render(); }
}

let _pollRunning = false;
let _poll404Count = 0;
async function pollJobStatus() {
  if (_pollRunning) return;  // evita pollings duplicados
  _pollRunning = true;
  _poll404Count = 0;
  try {
    while (state.job_id) {
      await new Promise(r => setTimeout(r, 2500));
      if (!state.job_id) break;
      try {
        const r = await fetch(API(`/jobs/${state.job_id}`));
        if (r.status === 404) {
          _poll404Count++;
          // Tolerar hasta 3 404 consecutivos (puede ser deploy en curso),
          // después asumir que el job se perdió y avisar al usuario
          if (_poll404Count >= 3) {
            state.job_status = "error";
            state.job_error = "El servidor se reinició y se perdió el reel en proceso. Recargá la página (Ctrl+Shift+R) y volvé a procesar — tenés que volver a subir los videos.";
            render();
            break;
          }
          continue;
        }
        _poll404Count = 0;  // reset si volvió a responder OK
        if (!r.ok) {
          console.warn("Poll non-OK:", r.status);
          continue;
        }
        const j = await r.json();
        state.job_status = j.status;
        state.job_log = j.log || [];
        state.job_error = j.error;
        state.job_duration = j.duration;
        state.job_download = j.download_url ? `${API_BASE}${j.download_url}` : null;
        render();
        if (j.status === "done" || j.status === "error") break;
      } catch (e) {
        // Network blip — esperá y reintentá (no rompas el loop)
        console.warn("Poll error, retrying:", e.message);
        await new Promise(r => setTimeout(r, 3000));
      }
    }
  } finally {
    _pollRunning = false;
  }
}

// Cuando la pestaña/app vuelve a ser visible (después de bloquear el celular
// o cambiar de app), reanudar el polling si había un job procesando
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.job_id &&
      state.job_status && state.job_status !== "done" && state.job_status !== "error") {
    console.log("Tab visible again — reanudando polling");
    pollJobStatus();
  }
});

// ── MANUAL EDITOR (CapCut-style with visual trim) ──────────────────
function openManualEditor() {
  const { files, sections } = buildPayload();
  if (files.length === 0) { alert("No hay clips para editar"); return; }
  const editorClips = [];
  let i = 0;
  sections.forEach(s => {
    s.clips.forEach(c => {
      editorClips.push({ id: `eclip_${i}`, fileIndex: c.file_index, fileName: files[c.file_index].name, dataUrl: URL.createObjectURL(files[c.file_index]), trim_start: c.trim_start, trim_duration: c.trim_duration, speed: c.speed, headline: c.headline || "", subline: c.subline || "", sourceDuration: null });
      i++;
    });
  });
  state.editor_clips = editorClips;
  state.editor_open = true;
  render();
  setTimeout(initEditorSortable, 50);
}

function closeManualEditor() {
  if (state.editor_sortable) { state.editor_sortable.destroy(); state.editor_sortable = null; }
  state.editor_open = false;
  render();
}

function initEditorSortable() {
  const list = document.getElementById("editor-clip-list");
  if (!list || typeof Sortable === "undefined") return;
  state.editor_sortable = Sortable.create(list, {
    handle: ".drag-handle", animation: 150,
    ghostClass: "sortable-ghost", chosenClass: "sortable-chosen",
    onEnd: (evt) => {
      const moved = state.editor_clips.splice(evt.oldIndex, 1)[0];
      state.editor_clips.splice(evt.newIndex, 0, moved);
    }
  });
}

function editorUpdateClip(id, field, value) {
  const c = state.editor_clips.find(x => x.id === id);
  if (!c) return;
  c[field] = value;
  const el = document.getElementById(`eff-${id}`);
  if (el) el.textContent = `${(c.trim_duration / c.speed).toFixed(1)}s en pantalla`;
}

function editorDeleteClip(id) {
  if (!confirm("¿Eliminar este clip?")) return;
  state.editor_clips = state.editor_clips.filter(c => c.id !== id);
  render();
  setTimeout(initEditorSortable, 50);
}

function editorMetadataLoaded(id, duration) {
  const c = state.editor_clips.find(x => x.id === id);
  if (!c) return;
  c.sourceDuration = duration;
  if (c.trim_start + c.trim_duration > duration) c.trim_duration = Math.max(0.5, duration - c.trim_start);
  const startInput = document.getElementById(`vstart-input-${id}`);
  const endInput = document.getElementById(`vend-input-${id}`);
  if (startInput) startInput.max = duration.toFixed(2);
  if (endInput) { endInput.max = duration.toFixed(2); endInput.value = (c.trim_start + c.trim_duration).toFixed(2); }
  const sourceLbl = document.getElementById(`source-dur-${id}`);
  if (sourceLbl) sourceLbl.textContent = `(fuente: ${duration.toFixed(1)}s)`;
  updateTrimUI(id);
}

function onTrimChange(id, which, value) {
  const c = state.editor_clips.find(x => x.id === id);
  if (!c) return;
  const v = document.getElementById(`video-${id}`);
  const maxDur = c.sourceDuration || 30;
  const minGap = 0.3;
  let val = parseFloat(value);
  if (which === 'start') {
    val = Math.max(0, Math.min(val, c.trim_start + c.trim_duration - minGap));
    const oldEnd = c.trim_start + c.trim_duration;
    c.trim_start = val;
    c.trim_duration = oldEnd - val;
    if (v) v.currentTime = val;
  } else {
    val = Math.min(maxDur, Math.max(val, c.trim_start + minGap));
    c.trim_duration = val - c.trim_start;
    if (v) v.currentTime = val;
  }
  updateTrimUI(id);
}

function updateTrimUI(id) {
  const c = state.editor_clips.find(x => x.id === id);
  if (!c) return;
  const trimEnd = c.trim_start + c.trim_duration;
  const srcDur = c.sourceDuration || 30;
  const startLbl = document.getElementById(`vstart-${id}`);
  const endLbl = document.getElementById(`vend-${id}`);
  const durLbl = document.getElementById(`vdur-${id}`);
  const startInput = document.getElementById(`vstart-input-${id}`);
  const endInput = document.getElementById(`vend-input-${id}`);
  const track = document.getElementById(`vtrack-${id}`);
  const effEl = document.getElementById(`eff-${id}`);
  if (startLbl) startLbl.textContent = c.trim_start.toFixed(1);
  if (endLbl) endLbl.textContent = trimEnd.toFixed(1);
  if (durLbl) durLbl.textContent = c.trim_duration.toFixed(1);
  if (startInput) startInput.value = c.trim_start;
  if (endInput) endInput.value = trimEnd;
  if (track) { track.style.left = ((c.trim_start / srcDur) * 100) + '%'; track.style.right = (100 - (trimEnd / srcDur) * 100) + '%'; }
  if (effEl) effEl.textContent = `${(c.trim_duration / c.speed).toFixed(1)}s en pantalla`;
}

function playSegment(id) {
  const c = state.editor_clips.find(x => x.id === id);
  const v = document.getElementById(`video-${id}`);
  if (!c || !v) return;
  v.currentTime = c.trim_start;
  v.play().catch(() => {});
  const stopAt = c.trim_start + c.trim_duration;
  const onTime = () => { if (v.currentTime >= stopAt) { v.pause(); v.removeEventListener('timeupdate', onTime); } };
  v.addEventListener('timeupdate', onTime);
}

function resetTrim(id) {
  const c = state.editor_clips.find(x => x.id === id);
  if (!c || !c.sourceDuration) return;
  c.trim_start = 0;
  c.trim_duration = c.sourceDuration;
  updateTrimUI(id);
}

function renderEditorClip(c, idx) {
  const effDur = (c.trim_duration / c.speed).toFixed(1);
  const srcDur = c.sourceDuration || 30;
  const trimEnd = c.trim_start + c.trim_duration;
  const startPct = (c.trim_start / srcDur) * 100;
  const endPct = (trimEnd / srcDur) * 100;
  return `
    <div class="editor-clip bg-slate-800 border border-slate-700 rounded-xl p-4 mb-3" data-id="${c.id}">
      <div class="flex items-start gap-3 mb-3">
        <div class="drag-handle text-slate-500 text-2xl pt-1 select-none">☰</div>
        <div class="flex-1 min-w-0"><div class="text-xs text-slate-400">Clip ${idx + 1}</div><div class="text-sm text-white truncate">${escapeHtml(c.fileName)}</div></div>
        <div class="text-right"><div class="text-xs text-amber-400 font-semibold" id="eff-${c.id}">${effDur}s en pantalla</div><button onclick="editorDeleteClip('${c.id}')" class="text-xs text-red-400 hover:text-red-300 mt-1">× Eliminar</button></div>
      </div>
      <div class="bg-slate-900 rounded-lg p-3 mb-3">
        <video src="${c.dataUrl}" id="video-${c.id}" preload="metadata" muted playsinline class="trim-preview-video mb-3" onloadedmetadata="editorMetadataLoaded('${c.id}', this.duration)"></video>
        <div class="flex justify-between text-xs text-slate-400 mb-1"><span>✂️ Recortar segmento <span id="source-dur-${c.id}" class="text-slate-600 text-[10px]">${c.sourceDuration ? `(fuente: ${c.sourceDuration.toFixed(1)}s)` : ''}</span></span><span class="text-white font-mono"><span id="vdur-${c.id}">${c.trim_duration.toFixed(1)}</span>s</span></div>
        <div class="dual-range" id="dr-${c.id}">
          <div class="track-bg"></div>
          <div class="track-sel" id="vtrack-${c.id}" style="left: ${startPct}%; right: ${100 - endPct}%;"></div>
          <input type="range" id="vstart-input-${c.id}" min="0" max="${srcDur}" step="0.1" value="${c.trim_start}" oninput="onTrimChange('${c.id}', 'start', this.value)">
          <input type="range" id="vend-input-${c.id}" min="0" max="${srcDur}" step="0.1" value="${trimEnd}" oninput="onTrimChange('${c.id}', 'end', this.value)">
        </div>
        <div class="flex justify-between text-[11px] text-slate-300 mt-1 font-mono"><span>🟢 Inicio: <span id="vstart-${c.id}">${c.trim_start.toFixed(1)}</span>s</span><span>🔴 Fin: <span id="vend-${c.id}">${trimEnd.toFixed(1)}</span>s</span></div>
        <div class="flex gap-2 mt-3"><button onclick="playSegment('${c.id}')" class="flex-1 px-3 py-2 bg-amber-400 text-slate-900 rounded font-medium text-xs hover:bg-amber-300">▶️ Previa del segmento</button><button onclick="resetTrim('${c.id}')" class="px-3 py-2 bg-slate-700 text-slate-200 rounded text-xs hover:bg-slate-600">↺ Todo</button></div>
        <div class="flex gap-2 mt-2">
          <button onclick="openRunwayModal('${c.id}')" class="flex-1 px-3 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded font-medium text-xs hover:opacity-90">✨ Rehacer con IA (Runway)</button>
          ${state.runway_replaced_clips[c.id] ? `<button onclick="revertRunwayClip('${c.id}')" class="px-3 py-2 bg-slate-700 text-slate-200 rounded text-xs hover:bg-slate-600" title="Volver al original">↺ Original</button>` : ''}
        </div>
        ${state.runway_replaced_clips[c.id] ? '<div class="text-[10px] text-purple-300 mt-1 text-center">✨ Toma regenerada con IA</div>' : ''}
      </div>
      <div class="mb-3"><div class="flex justify-between text-xs text-slate-400 mb-1"><span>⚡ Velocidad</span><span class="text-white font-mono"><span id="speed-lbl-${c.id}">${c.speed.toFixed(1)}</span>x</span></div><input type="range" min="0.5" max="4" step="0.25" value="${c.speed}" class="w-full" oninput="this.parentElement.querySelector('#speed-lbl-${c.id}').textContent=parseFloat(this.value).toFixed(1); editorUpdateClip('${c.id}','speed',parseFloat(this.value))"></div>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" placeholder="Título (opcional)" value="${escapeAttr(c.headline)}" maxlength="40" class="px-2 py-1.5 bg-slate-900 border border-slate-700 text-white text-xs rounded" oninput="editorUpdateClip('${c.id}','headline',this.value)">
        <input type="text" placeholder="Subtítulo (opcional)" value="${escapeAttr(c.subline)}" maxlength="50" class="px-2 py-1.5 bg-slate-900 border border-slate-700 text-white text-xs rounded" oninput="editorUpdateClip('${c.id}','subline',this.value)">
      </div>
    </div>`;
}

function renderManualEditor() {
  const totalEffDur = state.editor_clips.reduce((sum, c) => sum + (c.trim_duration / c.speed), 0);
  return `
    <div class="editor-modal">
      <div class="sticky top-0 bg-slate-900 border-b border-slate-700 px-4 py-3 flex items-center justify-between z-10">
        <div><div class="text-white font-bold">🎨 Editor avanzado</div><div class="text-xs text-slate-400">${state.editor_clips.length} clips · ${totalEffDur.toFixed(1)}s + cierre (5s)${state.logo_file ? ' + Logo (2s)' : ''}</div></div>

async function applyEditorChanges() {
  if (state.editor_clips.length === 0) { alert("No hay clips"); return; }
  if (!confirm(`¿Re-procesar con ${state.editor_clips.length} clips? Toma 1-2 minutos.`)) return;

  const hasRegenerated = state.editor_clips.some(c => c._runwayFile);

  if (hasRegenerated) {
    // Hay clips regenerados con Runway: tenemos que mandar un job NUEVO con todos los files
    const { files: originalFiles } = buildPayload();
    const finalFiles = [];
    const sections = [{
      name: "custom",
      clips: state.editor_clips.map((c, newIdx) => {
        finalFiles.push(c._runwayFile || originalFiles[c.fileIndex]);
        return {
          file_index: newIdx,
          trim_start: 0,  // Runway output is already trimmed to the segment
          trim_duration: c._runwayFile ? (c.trim_duration / c.speed) : c.trim_duration,
          speed: c._runwayFile ? 1.0 : c.speed,
          headline: c.headline || "",
          subline: c.subline || "",
        };
      })
    }];

    const fd = new FormData();
    fd.append("sections", JSON.stringify(sections));
    fd.append("cta_data", JSON.stringify(buildCtaData()));
    fd.append("music_preset", state.music_preset || "chill");
    fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
    finalFiles.forEach(f => fd.append("clips", f));
    if (state.music_file) fd.append("music", state.music_file);
    if (state.voice_audio_file) fd.append("voice_audio", state.voice_audio_file);
    if (state.logo_file) fd.append("logo", state.logo_file);

    state.editor_open = false;
    state.job_status = "uploading";
    state.is_reprocessing = false;
    state.job_log = [];
    state.job_error = null;
    state.job_download = null;
    render();

    try {
      const r = await fetch(API("/jobs"), { method: "POST", body: fd });
      if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
      const j = await r.json();
      state.job_id = j.job_id;
      state.job_status = j.status;
      render();
      pollJobStatus();
    } catch (e) { state.job_status = "error"; state.job_error = e.message || String(e); render(); }
  } else {
    // Reprocess standard (clips ya están en el server)
    const sections = [{ name: "custom", clips: state.editor_clips.map(c => ({ file_index: c.fileIndex, trim_start: c.trim_start, trim_duration: c.trim_duration, speed: c.speed, headline: c.headline || "", subline: c.subline || "" })) }];
    const fd = new FormData();
    fd.append("sections", JSON.stringify(sections));
    fd.append("cta_data", JSON.stringify(buildCtaData()));
    fd.append("music_preset", state.music_preset || "chill");
    fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
    state.editor_open = false;
    state.job_status = "reprocessing";
    state.is_reprocessing = true;
    state.job_log = [];
    state.job_error = null;
    state.job_download = null;
    render();
    try {
      const r = await fetchWithDetail(API(`/jobs/${state.job_id}/reprocess`), { method: "POST", body: fd });
      if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
      pollJobStatus();
    } catch (e) { state.job_status = "error"; state.job_error = e.message || String(e); render(); }
  }
}

// ── MAIN RENDER ────────────────────────────────────────────────────
function render() {
  renderStepper();
  const c = document.getElementById("step-content");
  if (state.step === 1) { c.innerHTML = renderStep1(); if (state.upload_mode === "simple") setTimeout(initSimpleSortable, 50); }
  if (state.step === 2) c.innerHTML = renderStep2();
  if (state.step === 3) c.innerHTML = renderStep3();
  if (state.step === 4) c.innerHTML = renderStep4();
  const existing = document.getElementById("editor-overlay");
  if (state.editor_open) {
    if (existing) existing.remove();
    const div = document.createElement("div");
    div.id = "editor-overlay";
    div.innerHTML = renderManualEditor();
    document.body.appendChild(div);
  } else if (existing) {
    existing.remove();
  }

  // Runway modal on top of editor
  const rwExisting = document.getElementById("runway-overlay");
  if (state.runway_modal_open) {
    if (rwExisting) rwExisting.remove();
    const div = document.createElement("div");
    div.id = "runway-overlay";
    div.style.zIndex = "150";
    div.style.position = "fixed";
    div.style.inset = "0";
    div.innerHTML = renderRunwayModal();
    document.body.appendChild(div);
  } else if (rwExisting) {
    rwExisting.remove();
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  render();
  await Promise.all([loadMusicPresets(), loadElevenVoices(), loadRunwayPresets()]);
  render();
});
</script>
</body>
</html>
