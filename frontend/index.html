<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreatDeal · Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ────────────────────────────────────────────────────────────────
     DESIGN SYSTEM — Dark luxury real estate (look "Valentina")
     Paleta: charcoal black + champagne gold + crisp white
     ──────────────────────────────────────────────────────────────── */
  :root {
    --bg-base:        #0a0a0b;    /* fondo general (black puro casi) */
    --bg-card:        #131316;    /* cards/contenedores */
    --bg-card-hover:  #1c1c20;
    --bg-input:       #18181c;
    --bg-elevated:    #1f1f24;    /* dropdowns, popovers */

    --text-primary:   #f5f0e6;    /* texto principal, blanco champagne */
    --text-secondary: #b8b3a7;    /* texto secundario, muted */
    --text-muted:     #8a8579;
    --text-faint:     #6a6559;

    --gold:           #c9a86a;    /* accent dorado champagne */
    --gold-bright:    #d4b876;
    --gold-dark:      #a68a52;
    --gold-soft:      rgba(201, 168, 106, 0.18);
    --gold-border:    rgba(201, 168, 106, 0.35);

    --success:        #6ec48a;
    --error:          #e57676;
    --border-subtle:  rgba(245, 240, 230, 0.08);
    --border-medium:  rgba(245, 240, 230, 0.15);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-base) !important;
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* Tipografía serif elegante para títulos premium */
  .font-serif, h1.serif, .serif-heading {
    font-family: 'Cormorant Garamond', 'Playfair Display', serif !important;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  /* ────────────────────────────────────────────────────────────────
     OVERRIDES de Tailwind utilities → mapear al design system
     (así no hay que cambiar cada clase en el HTML uno por uno)
     ──────────────────────────────────────────────────────────────── */
  .bg-white { background-color: var(--bg-card) !important; color: var(--text-primary); }
  .bg-slate-50 { background-color: var(--bg-base) !important; color: var(--text-primary); }
  .bg-slate-100 { background-color: var(--bg-card-hover) !important; color: var(--text-primary); }
  .bg-slate-200 { background-color: var(--bg-elevated) !important; }
  .bg-slate-800 { background-color: var(--bg-card) !important; }
  .bg-slate-900 { background-color: var(--gold) !important; color: var(--bg-base) !important; }
  .bg-slate-950 { background-color: #050505 !important; }
  .bg-stone-50, .bg-emerald-50, .bg-purple-50, .bg-amber-50, .bg-blue-50, .bg-red-50 { background-color: var(--bg-card) !important; color: var(--text-primary); }
  .bg-amber-500, .bg-amber-400 { background-color: var(--gold) !important; color: var(--bg-base) !important; }
  .bg-amber-600 { background-color: var(--gold-dark) !important; }
  .bg-purple-600, .bg-purple-700 { background-color: var(--gold) !important; color: var(--bg-base) !important; }
  .bg-emerald-500, .bg-emerald-600, .bg-green-500 { background-color: var(--success) !important; color: var(--bg-base) !important; }

  .text-slate-900, .text-slate-800 { color: var(--text-primary) !important; }
  .text-slate-700, .text-slate-600 { color: var(--text-secondary) !important; }
  .text-slate-500, .text-slate-400 { color: var(--text-muted) !important; }
  .text-slate-300 { color: var(--text-secondary) !important; }
  .text-slate-200, .text-slate-100 { color: var(--text-primary) !important; }
  .text-white { color: var(--text-primary) !important; }
  .text-emerald-700, .text-emerald-800, .text-emerald-900, .text-emerald-600 { color: var(--success) !important; }
  .text-amber-700, .text-amber-800, .text-amber-900, .text-amber-600 { color: var(--gold) !important; }
  .text-purple-700, .text-purple-800, .text-purple-900, .text-purple-600 { color: var(--gold) !important; }
  .text-red-700, .text-red-800, .text-red-900 { color: var(--error) !important; }

  .border-slate-200, .border-slate-300 { border-color: var(--border-subtle) !important; }
  .border-emerald-200, .border-emerald-300 { border-color: var(--gold-border) !important; }
  .border-purple-200, .border-purple-300, .border-purple-400, .border-purple-500 { border-color: var(--gold-border) !important; }
  .border-amber-200, .border-amber-300 { border-color: var(--gold-border) !important; }
  .border-red-200, .border-red-300 { border-color: rgba(229, 118, 118, 0.3) !important; }

  /* Inputs — fondo dark con borde sutil dorado */
  input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea, select {
    background-color: var(--bg-input) !important;
    color: var(--text-primary) !important;
    border-color: var(--border-medium) !important;
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted) !important; }
  input:focus, textarea:focus, select:focus {
    border-color: var(--gold) !important;
    outline: none !important;
    box-shadow: 0 0 0 1px var(--gold-soft) !important;
  }

  /* Sombras dramáticas pero sutiles para el dark theme */
  .shadow-sm, .shadow, .shadow-md, .shadow-lg, .shadow-xl { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--border-subtle) !important; }

  /* Hover states más sutiles en dark */
  .hover\\:bg-slate-50:hover, .hover\\:bg-slate-100:hover, .hover\\:bg-white:hover { background-color: var(--bg-card-hover) !important; }
  .hover\\:bg-slate-800:hover, .hover\\:bg-slate-900:hover { background-color: var(--gold-bright) !important; color: var(--bg-base) !important; }
  .hover\\:bg-purple-700:hover, .hover\\:bg-amber-600:hover { background-color: var(--gold-bright) !important; }

  /* Cards y contenedores — bordes más visibles con gold sutil */
  .rounded-2xl, .rounded-xl, .rounded-3xl { border-color: var(--border-subtle); }

  /* ──────────────── COMPONENTES CUSTOM ──────────────── */
  .fade-in { animation: fadeIn .3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .dropzone { transition: all 0.2s; border-style: dashed; border-color: var(--gold-border) !important; }
  .dropzone.drag { background: var(--gold-soft) !important; border-color: var(--gold) !important; transform: scale(1.02); }
  .spinner { animation: spin 1s linear infinite; border-color: var(--border-medium); border-top-color: var(--gold); }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .step-dot { transition: all 0.2s; }
  .section-card { transition: all 0.2s; }
  .section-card.complete { border-color: var(--gold) !important; background: var(--gold-soft) !important; }
  .clip-tile.sortable-ghost { opacity: 0.3; }
  .clip-tile.sortable-chosen { transform: scale(1.05); z-index: 10; }
  .editor-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .editor-clip.sortable-ghost { opacity: 0.4; background: var(--gold-dark); }
  .editor-clip.sortable-chosen { transform: scale(1.02); box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .drag-handle { cursor: grab; touch-action: none; }
  .drag-handle:active { cursor: grabbing; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; background: var(--bg-elevated); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: var(--gold); border-radius: 50%; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; background: var(--gold); border-radius: 50%; cursor: pointer; border: none; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform 0.2s; }
  .mode-pill { transition: all 0.2s; }
  .mode-pill.active { background: var(--gold) !important; color: var(--bg-base) !important; }
  .dual-range { position: relative; height: 48px; margin: 8px 0; touch-action: none; }
  .dual-range .track-bg { position: absolute; top: 22px; left: 0; right: 0; height: 4px; background: var(--bg-elevated); border-radius: 2px; }
  .dual-range .track-sel { position: absolute; top: 22px; height: 4px; background: var(--gold); border-radius: 2px; pointer-events: none; }
  .dual-range input[type="range"] { position: absolute; top: 0; left: 0; width: 100%; height: 48px; background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none; margin: 0; touch-action: pan-x; }
  .dual-range input[type="range"]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 32px; height: 32px; background: var(--gold); border: 3px solid var(--text-primary); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.6); margin-top: -14px; touch-action: pan-x; }
  .dual-range input[type="range"]::-moz-range-thumb { pointer-events: auto; width: 32px; height: 32px; background: var(--gold); border: 3px solid var(--text-primary); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.6); touch-action: pan-x; }
  .dual-range input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 4px; }
  .dual-range input[type="range"]::-moz-range-track { background: transparent; height: 4px; }
  .trim-preview-video { width: 100%; max-height: 220px; background: black; border-radius: 8px; }
  .editor-clip input[type="range"]:not(.dual-range *) { height: 36px; touch-action: pan-x; }
  .editor-clip input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; touch-action: pan-x; }
  .editor-clip input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; touch-action: pan-x; }
  .editor-clip { -webkit-user-select: none; user-select: none; }
  .editor-clip input, .editor-clip textarea { -webkit-user-select: text; user-select: text; }
  .ai-badge { background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright)); color: var(--bg-base); }

  /* ──────────────── PILLS & BADGES luxury ──────────────── */
  .luxury-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; border-radius: 999px;
    border: 1px solid var(--gold-border);
    color: var(--gold);
    background: var(--gold-soft);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .gold-accent { color: var(--gold) !important; }
  .gold-text-glow { color: var(--gold); text-shadow: 0 0 24px rgba(201,168,106,0.3); }

  /* Online indicator (header) */
  .online-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px rgba(110, 196, 138, 0.6);
    display: inline-block; margin-right: 6px;
  }

  /* ──────────────── Tipografía automática ──────────────── */
  /* Headlines grandes (los h1 de cada paso) en Cormorant Garamond serif elegante
     — matchea con el branding luxury de la app */
  h1.text-2xl, h1.text-3xl, .text-3xl.font-bold, .text-2xl.font-bold {
    font-family: 'Cormorant Garamond', 'Playfair Display', serif !important;
    font-weight: 600 !important;
    letter-spacing: 0.005em;
    color: var(--text-primary);
  }

  /* Highlight de números importantes (precios, métricas) → dorado serif */
  .gold-number {
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* Cards principales con padding airy + border sutil + glow muy sutil */
  .bg-white, .bg-slate-50 .bg-white {
    border: 1px solid var(--border-subtle);
  }

  /* Botones rounded-full automatic en los principales */
  button.rounded-xl, button.rounded-lg, a.rounded-xl, a.rounded-lg {
    border-radius: 14px;
  }

  /* Bottom-bar buttons especiales (Continuar / Volver) ya tienen estilo inline */

  /* Subtle gold glow on focus para feedback premium */
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Videos preview cards — mantener fondo black puro */
  video { background: #000 !important; }

  /* Pills tipo "RECOMENDADO" / "GRATIS" / etc → look luxury automático */
  .text-xs.uppercase {
    letter-spacing: 0.1em;
  }

  /* Scrollbars dark themed */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }

  /* Modal de Editor avanzado y Runway — fondo más profundo */
  .editor-modal { background: rgba(5,5,5,0.97) !important; }

  /* Iconos de emojis: contraste mejorado en dark mode */
  .text-xl, .text-2xl, .text-3xl, .text-4xl, .text-5xl { line-height: 1.1; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="sticky top-0 z-20" style="background: linear-gradient(180deg, #0a0a0b 0%, rgba(10,10,11,0.92) 100%); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-subtle);">
  <div class="max-w-4xl mx-auto px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="resetAll()" class="w-9 h-9 rounded-full flex items-center justify-center transition" style="border: 1px solid var(--border-subtle); color: var(--text-secondary);" title="Empezar de nuevo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="w-10 h-10 rounded-full flex items-center justify-center" style="border: 1.5px solid var(--gold-border); background: var(--gold-soft);">
        <span class="serif-heading gold-accent" style="font-size: 18px; font-weight: 600;">G</span>
      </div>
      <div class="flex flex-col">
        <span class="serif-heading" style="color: var(--text-primary); font-size: 20px; line-height: 1; letter-spacing: 0.02em;">GreatDeal</span>
        <span style="color: var(--text-muted); font-size: 11px; margin-top: 2px;"><span class="online-dot"></span>En línea</span>
      </div>
    </div>
    <div style="color: var(--text-faint); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;">
      <span class="serif-heading" style="font-style: italic; font-size: 14px; color: var(--gold);">IA</span>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; margin-left: 2px;">Premium</span>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 pb-32">
  <div class="pt-6 mb-6">
    <div class="flex items-center justify-center gap-3 flex-wrap" id="stepper"></div>
  </div>
  <div id="step-content"></div>
</main>

<div class="fixed bottom-0 left-0 right-0 z-20" style="background: linear-gradient(0deg, #0a0a0b 0%, rgba(10,10,11,0.92) 100%); backdrop-filter: blur(20px); border-top: 1px solid var(--border-subtle);">
  <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
    <button id="btn-prev" onclick="goPrev()" class="px-5 py-2.5 rounded-full disabled:opacity-30 transition" style="color: var(--text-secondary); border: 1px solid var(--border-subtle); background: transparent;">← Volver</button>
    <button id="btn-next" onclick="goNext()" class="px-7 py-3 rounded-full disabled:opacity-30 font-semibold transition" style="background: var(--gold); color: var(--bg-base); letter-spacing: 0.02em; box-shadow: 0 4px 20px rgba(201,168,106,0.25);">Continuar →</button>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────
const STEPS = [
  { id: 1, label: "Datos" },
  { id: 2, label: "Videos" },
  { id: 3, label: "Audio" },
  { id: 4, label: "Tu reel" },
];

const SECTION_ORDER = ["entrada", "dormitorios", "banos", "areas", "exterior", "vista"];

const SECTION_CONFIG = {
  exterior: { label: "Exterior", icon: "🏡", description: "Una toma del lugar desde afuera. Mostrá la fachada completa con luz natural.", tip: "Celular vertical, distancia que se vea el lugar entero. 3-4 segundos.", minClips: 0, maxClips: 1, defaultDuration: 3.5, speed: 1.0, defaultHeadline: "" },
  entrada: { label: "Entrada", icon: "🚪", description: "Grabá ~15 segundos caminando hacia y entrando al lugar. Lo aceleramos 3x.", tip: "Caminá firme y lento, celular vertical. Desde afuera hasta el living.", minClips: 0, maxClips: 1, defaultDuration: 15, speed: 3.0, defaultHeadline: "" },
  dormitorios: { label: "Dormitorios", icon: "🛏️", description: "1 a 5 panorámicas de cada dormitorio. 2.5 segundos cada toma.", tip: "Parate en un extremo y barré con el celular hacia el otro lado, fluído. Camas hechas.", minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0, defaultHeadline: "Dormitorios" },
  banos: { label: "Baños", icon: "🚿", description: "1 a 5 tomas cortas de baños. 2.5 seg cada una.", tip: "Panorámica o detalle de la grifería. Sin objetos personales.", minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0, defaultHeadline: "Baños" },
  areas: { label: "Áreas comunes", icon: "🛋️", description: "1 a 5 tomas de living, cocina, terraza, comedor. 2.5 seg cada una.", tip: "Ángulos amplios. Encendé luces y abrí cortinas para más luminosidad.", minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0, defaultHeadline: "Áreas comunes" },
  vista: { label: "Vista", icon: "🌅", description: "Cierre con la vista del lugar. 3 segundos.", tip: "Vista exterior (mar, cordillera, ciudad) desde la mejor ventana o terraza.", minClips: 0, maxClips: 1, defaultDuration: 3, speed: 1.0, defaultHeadline: "" },
};

const API_BASE = (() => {
  const host = window.location.hostname;
  if (host === "localhost" || host === "127.0.0.1") return "";
  return window.GREATDEAL_API_URL || "https://greatdeal-api.onrender.com";
})();
const API = (path) => `${API_BASE}/api${path}`;

// Fetch wrapper con mensajes de error útiles (sobre todo en móvil)
async function fetchWithDetail(url, opts) {
  try {
    const resp = await fetch(url, opts);
    return resp;
  } catch (e) {
    // "Failed to fetch" típico = network error o CORS
    const msg = String(e.message || e);
    const isOffline = !navigator.onLine;
    const detail = [
      `Error de red: ${msg}`,
      isOffline ? "📴 Estás sin conexión." : "📡 Verificá tu conexión a internet.",
      `URL: ${url}`,
      `Tip: si estás en red móvil, probá con WiFi. Las redes móviles a veces bloquean uploads grandes.`,
    ].join("\n");
    const err = new Error(detail);
    err.isNetworkError = true;
    throw err;
  }
}

function calcAutoDuration(n) {
  if (n === 0) return 3;
  return Math.max(1.8, Math.min(5, 26 / n));
}

// ── STATE ──────────────────────────────────────────────────────────
function emptySections() {
  const s = {};
  for (const k of SECTION_ORDER) s[k] = { clips: [], headline: SECTION_CONFIG[k].defaultHeadline };
  return s;
}

let state = {
  step: 1,
  upload_mode: "guided",
  sections: emptySections(),
  simple_clips: [],
  property: { tipo: "Casa", comuna: "", m2: "", dorms: "", banos: "", precio_uf: "", descripcion: "" },
  advanced_open: false,
  enhance_ai: false,
  auto_subtitles: true,  // por default ON: si hay voz, los subtítulos se quieren siempre
  music_preset: "cinematic_view",
  music_file: null,
  music_presets_catalog: [],
  cinematic_filter: "",            // "" = sin filtro / look natural
  cinematic_filters_catalog: [],   // se carga del backend
  // ── IA features ──
  caption_text: "",                // caption generado por IA
  caption_loading: false,
  caption_copied: false,
  clip_analyses: {},               // { clipId: {category, suggested_title, ...} }
  quality_report: null,            // { overall_score, summary, missing_shots, recommendations }
  quality_loading: false,
  // ── Versionado de reel ──
  previous_reel: null,             // {download, duration, caption, saved_at}
  adjustments_modal_open: false,   // modal "Aplicar ajustes" en pantalla final
  // ── Transcripción pre-procesamiento ──
  voice_transcript: "",            // texto completo editable
  voice_segments: [],              // [{start, end, text}]
  voice_transcribing: false,
  voice_transcript_dirty: false,   // si el user editó después de transcribir
  voice_audio_file: null,
  voice_audio_url: null,
  voice_method: "none",
  voice_script: "",
  voice_eleven_key: "",
  eleven_voices: [],
  is_recording: false,
  media_recorder: null,
  recorded_chunks: [],
  is_generating_voice: false,
  logo_file: null,
  logo_dataUrl: null,
  custom_tagline: "",
  custom_cta_info: "",
  custom_cta_precio: "",
  job_id: null, job_status: null, job_log: [], job_error: null,
  job_download: null, job_duration: null,
  is_reprocessing: false, has_been_processed: false,
  editor_open: false, editor_clips: [], editor_sortable: null, simple_sortable: null,
  // Runway AI per-clip regeneration
  runway_modal_open: false,
  runway_active_clip_id: null,
  runway_prompt: "",
  runway_preset_key: null,            // último preset clickeado (single)
  runway_preset_keys: [],             // multi-selección activa
  runway_presets: [],
  runway_available: false,
  runway_task_id: null,
  runway_task_status: null,
  runway_task_error: null,
  runway_cost_estimate: 0,
  runway_replaced_clips: {},  // map: clip_id -> {url, blob, file}
};

function resetAll() {
  if (!confirm("¿Empezar de cero? Se pierden los videos cargados.")) return;
  const catalog = state.music_presets_catalog;
  const voices = state.eleven_voices;
  state = {
    step: 1, upload_mode: "guided", sections: emptySections(), simple_clips: [],

function escapeHtml(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escapeAttr(s) { return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;"); }

function totalClipsCount() {
  if (state.upload_mode === "simple") return state.simple_clips.length;
  return SECTION_ORDER.reduce((acc, k) => acc + state.sections[k].clips.length, 0);
}

function switchUploadMode(mode) {
  if (mode === state.upload_mode) return;
  if (totalClipsCount() > 0) {
    if (!confirm("Si cambiás de modo se pierden los videos cargados. ¿Seguir?")) return;
    state.sections = emptySections();
    state.simple_clips = [];
  }
  state.upload_mode = mode;
  render();
}

// Preescuchar un preset de música (genera/cachea sample de 8s en backend)
let _previewAudio = null;
async function previewMusic(presetKey) {
  // Si ya está sonando este mismo preset → parar
  if (_previewAudio && state._music_playing === presetKey) {
    _previewAudio.pause();
    _previewAudio.currentTime = 0;
    _previewAudio = null;
    state._music_playing = null;
    render();
    return;
  }
  // Si está sonando otro → parar el anterior primero
  if (_previewAudio) {
    _previewAudio.pause();
    _previewAudio = null;
  }
  state._music_playing = presetKey;
  render();
  try {
    // Fetch para detectar errores HTTP antes de intentar reproducir
    const url = `${API_BASE}/api/music-preview/${presetKey}`;
    const r = await fetch(url);
    if (!r.ok) {
      const errText = await r.text();
      console.warn("Preview HTTP error:", r.status, errText);
      alert(`No pude generar el preview: HTTP ${r.status}. ${errText.slice(0, 200)}`);
      state._music_playing = null;
      render();
      return;
    }
    const blob = await r.blob();
    const blobUrl = URL.createObjectURL(blob);
    _previewAudio = new Audio(blobUrl);
    _previewAudio.addEventListener("ended", () => {
      URL.revokeObjectURL(blobUrl);
      _previewAudio = null;
      state._music_playing = null;
      render();
    });
    _previewAudio.addEventListener("error", (e) => {
      console.warn("Audio error:", e);
      URL.revokeObjectURL(blobUrl);
      _previewAudio = null;
      state._music_playing = null;
      render();
    });
    await _previewAudio.play();
  } catch (e) {
    console.warn("Preview failed:", e);
    alert(`No pude reproducir el preview: ${e.message}`);
    _previewAudio = null;
    state._music_playing = null;
    render();
  }
}

// Multi-toggle: agregar o quitar un preset del set activo
function selectRunwayPreset(key) {
  const p = state.runway_presets.find(x => x.key === key);
  if (!p) return;
  const i = state.runway_preset_keys.indexOf(key);
  if (i >= 0) {
    state.runway_preset_keys.splice(i, 1);  // quitar si ya estaba
  } else {
    state.runway_preset_keys.push(key);     // agregar
  }
  state.runway_preset_key = state.runway_preset_keys[state.runway_preset_keys.length - 1] || null;
  // Llenar el textarea con los prompts en español de los activos
  if (state.runway_preset_keys.length === 0) {
    state.runway_prompt = "";
  } else if (state.runway_preset_keys.length === 1) {
    const single = state.runway_presets.find(x => x.key === state.runway_preset_keys[0]);
    state.runway_prompt = single ? single.prompt : "";
  } else {
    const parts = state.runway_preset_keys.map(k => {
      const pr = state.runway_presets.find(x => x.key === k);
      return pr ? pr.prompt : "";
    }).filter(Boolean);
    state.runway_prompt = "Aplicar a la misma escena:\n\n• " + parts.join("\n\n• ");
  }
  render();
}

async function runwayGenerate() {
  if (!state.runway_prompt.trim()) { alert("Escribí o elegí un prompt"); return; }
  if (!state.runway_available) {
    alert("Runway no está configurada en el server.");
    return;
  }

  // Para clips del editor avanzado tenemos trim/speed. Para paso 1, usamos default.
  let dataUrl = state.runway_active_dataUrl;
  let fileName = state.runway_active_fileName || "clip.mp4";
  let targetDur = 5;
  const editorClip = state.editor_clips.find(x => x.id === state.runway_active_clip_id);
  if (editorClip) {
    dataUrl = editorClip.dataUrl;
    fileName = editorClip.fileName;
    const effDur = editorClip.trim_duration / editorClip.speed;
    targetDur = Math.min(effDur, 5);
  }
  const dur = 5;  // Runway siempre 5s (lo mínimo, $0.25)

  let clipBlob;
  try {
    const resp = await fetch(dataUrl);
    clipBlob = await resp.blob();
  } catch (e) {
    alert("Error preparando el clip: " + e.message);
    return;
  }

  const fd = new FormData();
  fd.append("clip", clipBlob, fileName);
  fd.append("prompt", state.runway_prompt);
  fd.append("model", "gen3a_turbo");
  fd.append("duration", String(dur));
  fd.append("target_duration", targetDur.toFixed(2));
  // Multi-presets: mandar CSV con todos los activos para que backend combine prompts
  if (state.runway_preset_keys && state.runway_preset_keys.length > 0) {
    fd.append("preset_keys", state.runway_preset_keys.join(","));
    // Compat: también mandamos el primer key como preset_key single
    fd.append("preset_key", state.runway_preset_keys[0]);
  } else if (state.runway_preset_key) {
    fd.append("preset_key", state.runway_preset_key);
  }

  state.runway_task_status = "uploading";
  state.runway_task_error = null;
  render();

  try {
    const r = await fetch(API("/runway/enhance-clip"), { method: "POST", body: fd });
    if (!r.ok) {
      const t = await r.text();
      throw new Error(`HTTP ${r.status} — ${t.slice(0, 300)}`);
    }
    const j = await r.json();
    state.runway_task_id = j.task_id;
    state.runway_task_status = j.status;
    render();
    runwayPollTask();
  } catch (e) {
    state.runway_task_status = "error";
    state.runway_task_error = e.message || String(e);
    render();
  }
}

async function runwayPollTask() {
  if (!state.runway_task_id) return;
  while (state.runway_task_id) {
    await new Promise(r => setTimeout(r, 4000));
    if (!state.runway_modal_open) return;  // user closed modal
    try {
      const r = await fetch(API(`/runway/tasks/${state.runway_task_id}`));
      const j = await r.json();
      state.runway_task_status = j.status;
      state.runway_task_error = j.error;
      render();
      if (j.status === "done") {
        // Download the regenerated clip
        const dlUrl = `${API_BASE}${j.download_url}`;
        const dlResp = await fetch(dlUrl);
        const blob = await dlResp.blob();
        const blobUrl = URL.createObjectURL(blob);
        const file = new File([blob], `runway_${state.runway_active_clip_id}.mp4`, { type: "video/mp4" });
        applyRunwayResult(state.runway_active_clip_id, file, blobUrl);
        return;
      }
      if (j.status === "error") return;
    } catch (e) {
      console.warn("Poll error:", e);
      break;
    }
  }
}

function applyRunwayResult(clipId, file, blobUrl) {
  const src = state.runway_source || { type: "editor", clipId };

  if (src.type === "editor") {
    const c = state.editor_clips.find(x => x.id === clipId);
    if (!c) return;
    if (!state.runway_replaced_clips[clipId]) {
      state.runway_replaced_clips[clipId] = { original_dataUrl: c.dataUrl, original_fileName: c.fileName };
    }
    if (c.dataUrl.startsWith('blob:')) URL.revokeObjectURL(c.dataUrl);
    c.dataUrl = blobUrl;
    c.fileName = file.name;
    c._runwayFile = file;
    c.sourceDuration = null;
    setTimeout(initEditorSortable, 50);
    setTimeout(() => alert("✓ Toma regenerada con IA. Dale 'Re-procesar' arriba para incluirla en el reel."), 100);
  } else if (src.type === "guided") {
    // Reemplazar clip en state.sections[key].clips[index]
    const sec = state.sections[src.sectionKey];
    const c = sec.clips[src.clipIndex];
    if (!c) return;
    if (c.dataUrl.startsWith('blob:')) URL.revokeObjectURL(c.dataUrl);
    c.dataUrl = blobUrl;
    c.file = file;  // reemplaza el File para que se mande al procesar
    c._runwayDone = true;  // marker visual
    setTimeout(() => alert("✓ Toma regenerada con IA. Cuando proceses el reel, va a usar esta versión."), 100);
  } else if (src.type === "simple") {
    const c = state.simple_clips.find(x => x.id === src.clipId);
    if (!c) return;
    if (c.dataUrl.startsWith('blob:')) URL.revokeObjectURL(c.dataUrl);
    c.dataUrl = blobUrl;
    c.file = file;
    c._runwayDone = true;
    setTimeout(() => alert("✓ Toma regenerada con IA. Cuando proceses el reel, va a usar esta versión."), 100);
  }
  state.runway_modal_open = false;
  state.runway_source = null;
  render();
}

function revertRunwayClip(clipId) {
  const backup = state.runway_replaced_clips[clipId];
  const c = state.editor_clips.find(x => x.id === clipId);
  if (!backup || !c) return;
  if (!confirm("¿Volver a la toma original (descartar la versión IA)?")) return;
  if (c.dataUrl.startsWith('blob:')) URL.revokeObjectURL(c.dataUrl);
  c.dataUrl = backup.original_dataUrl;
  c.fileName = backup.original_fileName;
  delete c._runwayFile;
  delete state.runway_replaced_clips[clipId];
  render();
  setTimeout(initEditorSortable, 50);
}

function estimateReelDuration() {
  let total = 0;
  if (state.upload_mode === "simple") {
    const n = state.simple_clips.length;
    total = n > 0 ? calcAutoDuration(n) * n : 0;
  } else {
    for (const k of SECTION_ORDER) {
      const cfg = SECTION_CONFIG[k];
      state.sections[k].clips.forEach(() => { total += cfg.defaultDuration / cfg.speed; });
    }
  }
  total += 5;
  if (state.logo_file) total += 2;
  return total;
}

function recommendedChars(d) {
  return { min: Math.round(d * 12), ideal: Math.round(d * 14), max: Math.round(d * 16) };
}

// ── VOICE: recording + Eleven generation ───────────────────────────
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    state.media_recorder = mr;
    state.recorded_chunks = [];
    mr.ondataavailable = e => { if (e.data.size > 0) state.recorded_chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(state.recorded_chunks, { type: mr.mimeType || 'audio/webm' });
      const ext = (mr.mimeType || '').includes('mp4') ? 'm4a' : 'webm';
      state.voice_audio_file = new File([blob], `voz_grabada.${ext}`, { type: mr.mimeType || 'audio/webm' });
      if (state.voice_audio_url) URL.revokeObjectURL(state.voice_audio_url);
      state.voice_audio_url = URL.createObjectURL(blob);
      stream.getTracks().forEach(t => t.stop());
      state.is_recording = false;
      state.media_recorder = null;
      // Limpiar y disparar transcripción del audio recién grabado
      state.voice_transcript = "";
      state.voice_segments = [];
      state.voice_transcript_dirty = false;
      setTimeout(() => autoTranscribeVoiceAudio(), 100);
      render();
    };
    mr.start();
    state.is_recording = true;
    render();
  } catch (e) { alert("No se pudo acceder al micrófono: " + e.message); }
}

function stopRecording() {
  if (state.media_recorder && state.is_recording) state.media_recorder.stop();
}

// Grabar descripción de propiedad → transcribir con Whisper → llenar el textarea
async function startRecordingDescription() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    state.desc_recorder = mr;
    state.desc_chunks = [];
    mr.ondataavailable = e => { if (e.data.size > 0) state.desc_chunks.push(e.data); };
    mr.onstop = async () => {
      const blob = new Blob(state.desc_chunks, { type: mr.mimeType || 'audio/webm' });
      stream.getTracks().forEach(t => t.stop());
      state.is_recording_desc = false;
      state.desc_transcribing = true;
      state.desc_recorder = null;
      render();
      // Mandar a Whisper para transcribir
      const fd = new FormData();
      fd.append("audio", blob, "descripcion.webm");
      try {
        const r = await fetch(API("/transcribe-audio"), { method: "POST", body: fd });
        if (!r.ok) {
          const t = await r.text();
          alert(`No pude transcribir: ${t.slice(0, 200)}`);
        } else {
          const j = await r.json();
          const transcribedText = j.text || "";
          // Sumar al texto existente (no reemplazar) para que Vale pueda combinar
          const sep = state.property.descripcion ? " " : "";
          state.property.descripcion = ((state.property.descripcion || "") + sep + transcribedText).trim().slice(0, 500);
        }
      } catch (e) {
        alert(`Error transcribiendo: ${e.message}`);
      }
      state.desc_transcribing = false;
      render();
    };
    mr.start();
    state.is_recording_desc = true;
    render();
  } catch (e) { alert("No pude acceder al micrófono: " + e.message); }
}

function stopRecordingDescription() {
  if (state.desc_recorder) state.desc_recorder.stop();

async function generateVoiceWithEleven() {
  if (!state.voice_script.trim()) { alert("Escribí el guion primero"); return; }
  if (!state.voice_eleven_key) { alert("Elegí una voz"); return; }
  state.is_generating_voice = true;
  render();
  try {
    const fd = new FormData();
    fd.append("script", state.voice_script);
    fd.append("voice_key", state.voice_eleven_key);
    const r = await fetch(API("/generate-voice"), { method: "POST", body: fd });
    if (!r.ok) { const t = await r.text(); throw new Error(`HTTP ${r.status} — ${t.slice(0, 300)}`); }
    const blob = await r.blob();
    state.voice_audio_file = new File([blob], "voz_eleven.mp3", { type: "audio/mpeg" });
    if (state.voice_audio_url) URL.revokeObjectURL(state.voice_audio_url);
    state.voice_audio_url = URL.createObjectURL(blob);
    // ElevenLabs ya nos da el texto exacto — sin necesidad de transcribir
    state.voice_transcript = state.voice_script || "";
    // Aproximar segments con todo el texto en un solo segment
    state.voice_segments = [{ start: 0, end: 30, text: state.voice_script || "" }];
    state.voice_transcript_dirty = false;
  } catch (e) {
    alert("Error generando voz: " + e.message);
  } finally {
    state.is_generating_voice = false;
    render();
  }
}

function renderStepper() {
  const html = STEPS.map((s, i) => {
    const active = state.step === s.id;
    const done = state.step > s.id;
    let dotStyle, textStyle;
    if (active) {
      dotStyle = 'background: var(--gold); color: var(--bg-base); border: 1.5px solid var(--gold); box-shadow: 0 0 18px rgba(201,168,106,0.5);';
      textStyle = 'color: var(--gold); font-weight: 600; letter-spacing: 0.04em;';
    } else if (done) {
      dotStyle = 'background: transparent; color: var(--gold); border: 1.5px solid var(--gold-border);';
      textStyle = 'color: var(--text-secondary);';
    } else {
      dotStyle = 'background: transparent; color: var(--text-muted); border: 1px solid var(--border-subtle);';
      textStyle = 'color: var(--text-muted);';
    }
    return `
      <div class="flex items-center gap-2">
        <div class="step-dot w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold transition" style="${dotStyle}">${done ? '✓' : s.id}</div>
        <span class="text-xs uppercase tracking-wider" style="${textStyle}">${s.label}</span>
      </div>
      ${i < STEPS.length - 1 ? `<div class="w-6 h-px" style="background: ${done ? 'var(--gold-border)' : 'var(--border-subtle)'};"></div>` : ''}
    `;
  }).join("");
  document.getElementById("stepper").innerHTML = html;

  document.getElementById("btn-prev").disabled = (state.step === 1);
  const next = document.getElementById("btn-next");
  if (state.step === 4) {
    const isProc = state.job_status && state.job_status !== "done" && state.job_status !== "error";
    if (isProc) { next.textContent = "Procesando…"; next.disabled = true; }
    else if (!state.has_been_processed) { next.textContent = "Generar mi reel →"; next.disabled = false; }
    else { next.textContent = "✓ Listo"; next.disabled = true; }
  } else if (state.step === 2) {
    next.textContent = "Continuar →";
    next.disabled = totalClipsCount() === 0;
  } else {
    next.textContent = "Continuar →";
    next.disabled = false;
  }
}

function goNext() {
  if (state.step === 2 && totalClipsCount() === 0) { alert("Subí al menos un video"); return; }
  if (state.step === 4 && !state.has_been_processed) { processReel(); return; }
  if (state.step < STEPS.length) { state.step++; render(); }
}

function goPrev() { if (state.step > 1) { state.step--; render(); } }

// ─────────────────────────────────────────────────────────────────
// COMPRESIÓN CLIENT-SIDE de videos antes de upload
// Reescala a 540x960 a ~1.5 Mbps usando Canvas + MediaRecorder.
// iPhone 4K (~200 MB) → ~5-15 MB. Permite subir en red móvil sin
// "Failed to fetch". Si falla (browser viejo), fallback al original.
// ─────────────────────────────────────────────────────────────────
const COMPRESS_TARGET_W = 540;
const COMPRESS_TARGET_H = 960;
const COMPRESS_BITRATE = 1_500_000; // 1.5 Mbps — buena calidad para reels

function pickRecorderMimeType() {
  const candidates = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm;codecs=vp9",
    "video/webm",
    "video/mp4",
  ];
  for (const t of candidates) {
    try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t; }
    catch (_) {}
  }
  return null;
}

async function compressVideoFile(file, onProgress) {
  // DESACTIVADO TEMPORALMENTE: la compresión client-side con MediaRecorder
  // genera WebM con header EBML incompatible con FFmpeg server-side (Runway/reel
  // procesamiento fallan con "EBML header parsing failed"). Mejor mandar el
  // archivo original. Para uploads grandes en red móvil, usar WiFi.
  // TODO: implementar compresión server-side o usar WebCodecs API
  return file;

  // ─── Código de compresión deshabilitado (mantener para futura ref) ───
  // eslint-disable-next-line no-unreachable
  const mime = pickRecorderMimeType();
  if (!mime || !HTMLCanvasElement.prototype.captureStream) {
    return file; // fallback al original
  }
  if (file.size < 5 * 1024 * 1024) {
    return file; // <5MB ya es razonable, no comprimir
  }

  return new Promise((resolve) => {
    const video = document.createElement("video");
    video.src = URL.createObjectURL(file);
    video.muted = true;
    video.playsInline = true;
    video.crossOrigin = "anonymous";

    const cleanup = () => { try { URL.revokeObjectURL(video.src); } catch (_) {} };
    const failSafe = setTimeout(() => { cleanup(); resolve(file); }, 120_000);

    video.onerror = () => { clearTimeout(failSafe); cleanup(); resolve(file); };
    video.onloadedmetadata = async () => {
      try {
        const srcW = video.videoWidth, srcH = video.videoHeight;
        if (!srcW || !srcH) { clearTimeout(failSafe); cleanup(); return resolve(file); }

        // Aspect-fit dentro de 540x960 con padding negro (matchea pipeline FFmpeg)
        const srcAspect = srcW / srcH;
        const tgtAspect = COMPRESS_TARGET_W / COMPRESS_TARGET_H;
        let dstW, dstH;
        if (srcAspect > tgtAspect) {
          dstW = COMPRESS_TARGET_W;
          dstH = Math.round(COMPRESS_TARGET_W / srcAspect);
        } else {
          dstH = COMPRESS_TARGET_H;
          dstW = Math.round(COMPRESS_TARGET_H * srcAspect);
        }
        const offX = Math.round((COMPRESS_TARGET_W - dstW) / 2);
        const offY = Math.round((COMPRESS_TARGET_H - dstH) / 2);

        const canvas = document.createElement("canvas");
        canvas.width = COMPRESS_TARGET_W;
        canvas.height = COMPRESS_TARGET_H;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, COMPRESS_TARGET_W, COMPRESS_TARGET_H);

        // Video-ONLY stream (sin audio — el reel usa música/voz separadas;
        // capturar audio del video original rompe el container WebM en muchos browsers)
        const stream = canvas.captureStream(30);

        // Elegir mime que sea sólo video (sin codec de audio en el string)
        // para que el recorder no espere audio tracks
        let videoOnlyMime = mime;
        if (videoOnlyMime.includes(",opus")) {
          videoOnlyMime = videoOnlyMime.replace(",opus", "");
        }
        if (!MediaRecorder.isTypeSupported(videoOnlyMime)) {
          videoOnlyMime = "video/webm";
        }

        const recorder = new MediaRecorder(stream, {
          mimeType: videoOnlyMime,
          videoBitsPerSecond: COMPRESS_BITRATE,
        });
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onerror = () => { clearTimeout(failSafe); cleanup(); resolve(file); };
        recorder.onstop = () => {
          clearTimeout(failSafe);
          try {
            const blob = new Blob(chunks, { type: videoOnlyMime });
            if (blob.size < 50_000) {
              // Algo salió mal con la grabación
              cleanup(); return resolve(file);
            }
            const ext = videoOnlyMime.includes("mp4") ? "mp4" : "webm";
            const baseName = file.name.replace(/\.[^.]+$/, "");
            const compressed = new File([blob], `${baseName}_opt.${ext}`, { type: videoOnlyMime });
            cleanup();
            // Si la compresión no redujo, devolver original
            if (compressed.size >= file.size * 0.95) {
              return resolve(file);
            }
            resolve(compressed);
          } catch (_) {
            cleanup();
            resolve(file);
          }
        };

        let stopped = false;
        const finishRecording = () => {
          if (stopped) return;
          stopped = true;
          // Flush último chunk antes de stop → garantiza header EBML completo
          try { recorder.requestData(); } catch (_) {}
          setTimeout(() => { try { recorder.stop(); } catch (_) {} }, 80);
        };
        const drawFrame = () => {
          if (stopped) return;
          if (video.ended || video.paused) { finishRecording(); return; }
          ctx.drawImage(video, offX, offY, dstW, dstH);
          if (typeof onProgress === "function") {
            onProgress(Math.min(0.99, video.currentTime / Math.max(0.1, video.duration || 1)));
          }
          requestAnimationFrame(drawFrame);
        };

        video.onended = finishRecording;

        // Pedir chunks cada 1s (vs 500ms) para que el header se escriba primero
        recorder.start(1000);
        await video.play();
        drawFrame();
      } catch (_) {
        clearTimeout(failSafe);
        cleanup();
        resolve(file);
      }
    };
  });
}

async function handleSimpleUpload(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith("video/"));
  if (arr.length === 0) return;
  for (let i = 0; i < arr.length; i++) {
    const f = arr[i];
    const dataUrl = await new Promise((res) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(f);
    });
    const suggestedTitle = suggestSimpleHeadline(state.simple_clips.length);
    state.simple_clips.push({
      id: `s_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      file: f, dataUrl, name: f.name,
      headline: suggestedTitle, subline: "",
    });
    render();
    setTimeout(initSimpleSortable, 50);
  }
}

function removeSimpleClip(id) {
  state.simple_clips = state.simple_clips.filter(c => c.id !== id);
  render();
  setTimeout(initSimpleSortable, 50);
}

function initSimpleSortable() {
  const grid = document.getElementById("simple-clips-grid");
  if (!grid || typeof Sortable === "undefined") return;
  if (state.simple_sortable) state.simple_sortable.destroy();
  state.simple_sortable = Sortable.create(grid, {
    animation: 150, ghostClass: "sortable-ghost", chosenClass: "sortable-chosen",
    onEnd: (evt) => {
      const moved = state.simple_clips.splice(evt.oldIndex, 1)[0];
      state.simple_clips.splice(evt.newIndex, 0, moved);
      grid.querySelectorAll(".clip-tile").forEach((tile, i) => {
        const badge = tile.querySelector("div");
        if (badge) badge.textContent = i + 1;
      });
    }
  });
}

        </div>
        <div class="text-xs ${complete ? 'text-emerald-600' : 'text-slate-400'} font-medium">${count}/${cfg.maxClips}</div>
      </div>
      <p class="text-xs text-slate-700 mb-1">${escapeHtml(cfg.description)}</p>
      <p class="text-[11px] text-slate-500 italic mb-3">💡 ${escapeHtml(cfg.tip)}</p>
      ${clipsHtml}
      ${actionButtons}
    </div>
  `;
}

// Genera un título pre-llenado editable según la sección y la posición del clip
function suggestHeadline(sectionKey, indexInSection) {
  const n = indexInSection + 1;
  switch (sectionKey) {
    case "exterior": return "Vista";
    case "entrada":  return "Entrada";
    case "dormitorios":
      return n === 1 ? "Dormitorio principal" : `Dormitorio ${n}`;
    case "banos":
      return n === 1 ? "Baño principal" : `Baño ${n}`;
    case "areas":
      const sugerencias = ["Living", "Cocina", "Comedor", "Terraza", "Espacio común"];
      return sugerencias[indexInSection] || `Espacio ${n}`;
    case "vista": return "Vista del lugar";
    default: return `Toma ${n}`;
  }
}

// Genera un título pre-llenado para modo simple (sin contexto de sección)
function suggestSimpleHeadline(indexInList) {
  return `Toma ${indexInList + 1}`;
}

async function handleSectionUpload(key, files) {
  const cfg = SECTION_CONFIG[key];
  const sec = state.sections[key];
  const slotsLeft = cfg.maxClips - sec.clips.length;
  const arr = Array.from(files).filter(f => f.type.startsWith("video/")).slice(0, slotsLeft);
  if (arr.length === 0) return;
  for (let i = 0; i < arr.length; i++) {
    const f = arr[i];
    const dataUrl = await new Promise((res) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(f);
    });
    const suggestedTitle = suggestHeadline(key, sec.clips.length);
    sec.clips.push({
      id: `g_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      file: f, dataUrl, name: f.name,
      headline: suggestedTitle, subline: "",
    });
    render();
  }
}

function removeSectionClip(key, idx) {
  state.sections[key].clips.splice(idx, 1);
  render();
}

function setVoiceMethod(method) {
  if (method !== state.voice_method && state.voice_audio_file) {
    if (!confirm("Hay una voz cargada. ¿Cambiar de método? (se borra la voz actual)")) return;
    clearVoice();
  }
  if (method === "none") clearVoice();
  state.voice_method = method;
  // Si elige "Generar con IA" y NO escribió script aún, pre-llenar con descripción de la propiedad
  if (method === "eleven" && !state.voice_script && state.property.descripcion) {
    state.voice_script = state.property.descripcion;
  }
  render();
}

    `;

    const voiceOptions = state.eleven_voices.map(v => {
      const key = v.key || v.id || "";
      const label = v.label || v.name || key;
      return `<option value="${key}" ${state.voice_eleven_key === key ? 'selected' : ''}>${escapeHtml(label)}</option>`;
    }).join("");

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-500 block mb-1">Voz</label>

        <p class="text-[10px] text-slate-500">El guion lo tomamos de la caja de texto de arriba.</p>

  return `

        <h2 class="font-bold text-slate-900 text-lg">Agregar voz al reel</h2>

        <label class="relative inline-flex items-center cursor-pointer">

          <div class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-pink-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
        </label>
      </div>

      <button onclick="applyVoiceToReel()" ${(!state.voice_audio_file || state.voice_method === 'none') ? 'disabled' : ''} class="w-full px-6 py-3 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed">
        ✨ Aplicar voz al reel y re-procesar
      </button>
      ${(!state.voice_audio_file || state.voice_method === 'none') ? '<div class="text-[10px] text-slate-500 text-center mt-2">Primero cargá una voz (subir / grabar / generar IA)</div>' : ''}
    </div>
  `;
}

function updateCharCounter() {
  const realDur = state.job_duration || estimateReelDuration();
  const chars = recommendedChars(realDur);
  const currentChars = (state.voice_script || "").length;
  const el = document.getElementById("voice-char-status");
  if (!el) return;
  if (currentChars === 0) {
    el.innerHTML = `<span class="text-slate-500">${currentChars} / ${chars.ideal} caracteres ideal</span>`;
  } else if (currentChars > chars.max) {
    el.innerHTML = `<span class="text-red-600 font-bold">⚠ ${currentChars} chars · Te pasaste por ${currentChars - chars.max} chars (va a sonar lento o cortado)</span>`;
  } else if (currentChars < chars.min) {
    el.innerHTML = `<span class="text-amber-600 font-medium">${currentChars} chars · Faltan ${chars.min - currentChars} (la voz va a sonar muy rápida o con silencios)</span>`;
  } else {
    el.innerHTML = `<span class="text-emerald-600 font-medium">✓ ${currentChars} chars · Calza bien con la duración del reel</span>`;
  }
}

async function applyVoiceToReel() {
  if (!state.voice_audio_file) { alert("Cargá una voz primero"); return; }
  if (!state.job_id) { alert("No hay reel para aplicarle voz"); return; }
  if (!confirm("¿Aplicar la voz al reel y re-procesar? Toma 1-2 minutos.")) return;

  // Build sections from current state (no changes to clips)
  const { sections } = buildPayload();
  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "cinematic_view");
  fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
    fd.append("cinematic_filter", state.cinematic_filter || "");
    if (state.voice_segments && state.voice_segments.length > 0) {
      fd.append("voice_segments_json", JSON.stringify(state.voice_segments));
    }
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
  fd.append("voice_audio", state.voice_audio_file);

  state.job_status = "reprocessing";
  state.is_reprocessing = true;
  state.job_log = [];
  state.job_error = null;
  state.job_download = null;
  render();

  try {
    const r = await fetchWithDetail(API(`/jobs/${state.job_id}/reprocess`), { method: "POST", body: fd });
    if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
    pollJobStatus();
  } catch (e) {
    state.job_status = "error";
    state.job_error = e.message || String(e);
    render();
  }
}

function handleVoiceUpload(file) {
  if (!file) return;
  if (state.voice_audio_url) URL.revokeObjectURL(state.voice_audio_url);
  state.voice_audio_file = file;
  state.voice_audio_url = URL.createObjectURL(file);
  // Limpiar transcripción anterior (es otro audio)
  state.voice_transcript = "";
  state.voice_segments = [];
  state.voice_transcript_dirty = false;
  render();
  // Auto-transcribir el nuevo audio en background
  autoTranscribeVoiceAudio();
}

// ── STEP 4: TU REEL ────────────────────────────────────────────────
function renderStep4() {
  const isDone = state.job_status === "done";

    return `
      <div class="fade-in max-w-md mx-auto text-center pt-12">

        ${state.job_log.length ? `<div class="text-xs text-slate-400 italic">${escapeHtml(state.job_log[state.job_log.length - 1])}</div>` : ''}

          <button onclick="state.step=1; render()" class="px-5 py-2.5 bg-slate-900 text-white rounded-lg">← Volver al inicio</button>

      { key: "", label: "🎥 Original", desc: "Sin efecto" },
      { key: "aumentar_contraste", label: "🔆 + Contraste", desc: "Negros y blancos más definidos" },
      { key: "mejorar_luz", label: "💡 + Luz", desc: "Levanta sombras, equilibra" },
      { key: "mejorar_nitidez", label: "✨ + Nitidez", desc: "Detalles más cristalinos" },
    ];
    const effectButtons = quickEffects.map(e => {
      const active = state.cinematic_filter === e.key;
      return `
        <button onclick="setPreviewFilter('${e.key}')" class="text-left p-2.5 rounded-xl transition-all" style="background: ${active ? 'var(--gold-soft)' : 'rgba(255,255,255,0.03)'}; border: 1px solid ${active ? 'var(--gold)' : 'var(--border-subtle)'};">

      `;
    }).join("");

      !["aumentar_contraste", "mejorar_luz", "mejorar_nitidez"].includes(f.key)

    return `
      <div class="fade-in max-w-2xl mx-auto">
        <div class="text-center mb-4">

        ${isPreviewing ? `
          <div class="text-center text-[11px] mb-3" style="color: var(--gold);">
            👁️ Previsualizando "${escapeHtml(quickEffects.concat(cineLooks).find(f => f.key === filter)?.label || filter)}" — Para aplicarlo definitivo tocá "Aplicar y regenerar" abajo
          </div>

// ── PROCESS / REPROCESS ────────────────────────────────────────────
function buildCtaData() {
  const p = state.property;
  return {
    info: (state.custom_cta_info || "").trim() || `${p.m2 || '—'} m² · ${p.dorms || '—'} dorm · ${p.banos || '—'} baños`,
    precio: (state.custom_cta_precio || "").trim() || (p.precio_uf ? `Desde ${p.precio_uf} UF` : 'Consultar'),
    tagline: (state.custom_tagline || "").trim(),  // vacío = no aparece la línea
  };
}

function buildPayload() {
  if (state.upload_mode === "simple") {
    const dur = calcAutoDuration(state.simple_clips.length);
    const files = state.simple_clips.map(c => c.file);
    const sections = [{
      name: "default",
      clips: state.simple_clips.map((c, i) => ({
        file_index: i,
        trim_start: 0,
        trim_duration: dur,
        speed: 1.0,
        headline: (c.headline || "").trim(),
        subline: (c.subline || "").trim(),
      }))
    }];
    return { files, sections };
  }
  const files = [];
  const sections = [];
  for (const key of SECTION_ORDER) {
    const cfg = SECTION_CONFIG[key];
    const sec = state.sections[key];
    if (sec.clips.length === 0) continue;
    const clips = sec.clips.map((c, i) => {
      const fi = files.length;
      files.push(c.file);
      // Solo usamos el headline del clip individual. Si está vacío, NO se renderiza texto.
      const headline = (c.headline || "").trim();
      const subline = (c.subline || "").trim();
      return {
        file_index: fi,
        trim_start: 0,
        trim_duration: cfg.defaultDuration,
        speed: cfg.speed,
        headline,
        subline,
      };
    });
    sections.push({ name: key, clips });
  }
  return { files, sections };
}

async function processReel() {
  const { files, sections } = buildPayload();
  if (files.length === 0) { alert("No hay videos para procesar"); state.step = 1; render(); return; }
  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "cinematic_view");
  fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
    fd.append("cinematic_filter", state.cinematic_filter || "");
    if (state.voice_segments && state.voice_segments.length > 0) {
      fd.append("voice_segments_json", JSON.stringify(state.voice_segments));
    }
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
  files.forEach(f => fd.append("clips", f));
  if (state.music_file) fd.append("music", state.music_file);
  if (state.voice_audio_file) fd.append("voice_audio", state.voice_audio_file);
  if (state.logo_file) fd.append("logo", state.logo_file);
  state.job_status = "uploading";
  state.is_reprocessing = false;
  state.has_been_processed = true;
  state.job_error = null;
  state.job_log = [];
  render();
  try {
    const r = await fetchWithDetail(API("/jobs"), { method: "POST", body: fd });
    if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
    const j = await r.json();
    state.job_id = j.job_id;
    state.job_status = j.status;
    render();
    pollJobStatus();
  } catch (e) { state.job_status = "error"; state.job_error = e.message || String(e); render(); }
}

async function reprocessFromCurrent() {
  if (!state.job_id) { processReel(); return; }
  if (!confirm("¿Re-procesar el reel con los cambios?")) return;
  const { sections } = buildPayload();
  if (sections.length === 0) { alert("No hay videos"); return; }
  // ── GUARDAR EL REEL ANTERIOR para poder volver ──
  if (state.job_download) {
    state.previous_reel = {
      download: state.job_download,
      duration: state.job_duration,
      caption: state.caption_text,
      saved_at: Date.now(),
    };
  }
  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "cinematic_view");
  fd.append("enhance_ai", state.enhance_ai ? "true" : "false");
    fd.append("cinematic_filter", state.cinematic_filter || "");
    if (state.voice_segments && state.voice_segments.length > 0) {
      fd.append("voice_segments_json", JSON.stringify(state.voice_segments));
    }
  fd.append("auto_subtitles", state.auto_subtitles ? "true" : "false");
  state.job_status = "reprocessing";
  state.is_reprocessing = true;
  state.job_log = [];
  state.job_error = null;
  state.job_download = null;
  render();
  try {
    const r = await fetchWithDetail(API(`/jobs/${state.job_id}/reprocess`), { method: "POST", body: fd });
    if (!r.ok) { let d = `HTTP ${r.status}`; try { d += ` — ${(await r.text()).slice(0,400)}`; } catch(_) {} throw new Error(d); }
    pollJobStatus();
  } catch (e) { state.job_status = "error"; state.job_error = e.message || String(e); render(); }
}

let _pollRunning = false;
let _poll404Count = 0;
async function pollJobStatus() {
  if (_pollRunning) return;  // evita pollings duplicados
  _pollRunning = true;
  _poll404Count = 0;
  try {
    while (state.job_id) {
      await new Promise(r => setTimeout(r, 2500));
      if (!state.job_id) break;
      try {
        const r = await fetch(API(`/jobs/${state.job_id}`));
        if (r.status === 404) {
          _poll404Count++;
          // Tolerar hasta 3 404 consecutivos (puede ser deploy en curso),
          // después asumir que el job se perdió y avisar al usuario
          if (_poll404Count >= 3) {
            state.job_status = "error";
            state.job_error = "El servidor se reinició y se perdió el reel en proceso. Recargá la página (Ctrl+Shift+R) y volvé a procesar — tenés que volver a subir los videos.";
            render();
            break;
          }
          continue;
        }
        _poll404Count = 0;  // reset si volvió a responder OK
        if (!r.ok) {
          console.warn("Poll non-OK:", r.status);
          continue;
        }
        const j = await r.json();
        state.job_status = j.status;
        state.job_log = j.log || [];
        state.job_error = j.error;
        state.job_duration = j.duration;
        state.job_download = j.download_url ? `${API_BASE}${j.download_url}` : null;
        render();
        if (j.status === "done" || j.status === "error") break;
      } catch (e) {
        // Network blip — esperá y reintentá (no rompas el loop)
        console.warn("Poll error, retrying:", e.message);
        await new Promise(r => setTimeout(r, 3000));
      }
    }
  } finally {
    _pollRunning = false;
  }
}

// Cuando la pestaña/app vuelve a ser visible (después de bloquear el celular
// o cambiar de app), reanudar el polling si había un job procesando
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.job_id &&
      state.job_status && state.job_status !== "done" && state.job_status !== "error") {
    console.log("Tab visible again — reanudando polling");
    pollJobStatus();
  }
});

// TRANSCRIPCIÓN PRE-PROCESAMIENTO EDITABLE
// Cuando el usuario sube/graba audio, transcribimos automáticamente con
// Whisper y mostramos el texto editable. Cuando regenera el reel, mandamos
// el texto corregido en vez de re-transcribir.
// ═══════════════════════════════════════════════════════════════════
async function autoTranscribeVoiceAudio() {
  const file = state.voice_audio_file;
  if (!file) { return; }
  state.voice_transcribing = true;
  state.voice_transcript = "";
  state.voice_segments = [];
  state.voice_transcript_dirty = false;
  render();
  try {
    const fd = new FormData();
    fd.append("audio", file);
    const r = await fetch(API("/transcribe-audio"), { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Error transcribiendo");
    state.voice_segments = j.segments || [];
    state.voice_transcript = j.text || (j.segments || []).map(s => s.text).join(" ");
  } catch (e) {
    console.warn("auto-transcribe:", e);
    state.voice_transcript = "";
    state.voice_segments = [];
  } finally {
    state.voice_transcribing = false;
    render();
  }
}

// Cuando el user edita el textarea, sincronizamos el texto editado a los
// segments. Estrategia simple: dividir el texto editado por oraciones y
// distribuirlo proporcionalmente al timing de los segments originales.
function updateVoiceTranscript(newText) {
  state.voice_transcript = newText;
  state.voice_transcript_dirty = true;
  if (!state.voice_segments || state.voice_segments.length === 0) return;
  // Repartir el texto entre los segments proporcionalmente
  const sentences = newText.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [newText];
  const segCount = state.voice_segments.length;
  if (sentences.length === segCount) {
    // Match exacto — asignar uno a uno
    sentences.forEach((s, i) => { state.voice_segments[i].text = s.trim(); });
  } else if (sentences.length === 1 || segCount === 1) {
    // Todo el texto a un solo segment grande
    state.voice_segments[0].text = newText.trim();
    for (let i = 1; i < segCount; i++) state.voice_segments[i].text = "";
  } else {
    // Aproximación: repartir uniformemente
    const perSeg = Math.ceil(sentences.length / segCount);
    for (let i = 0; i < segCount; i++) {
      state.voice_segments[i].text = sentences.slice(i * perSeg, (i + 1) * perSeg).join(" ").trim();
    }
  }
}

function restorePreviousReel() {
  if (!state.previous_reel) return;
  if (!confirm("¿Volver al reel anterior y descartar el actual?")) return;
  state.job_download = state.previous_reel.download;

  state.caption_text = state.previous_reel.caption || "";

}

  try {
    await navigator.clipboard.writeText(state.caption_text || "");
    state.caption_copied = true;
    render();
    setTimeout(() => { state.caption_copied = false; render(); }, 2200);
  } catch (e) {
    alert("No pude copiar — seleccioná el texto manualmente");

}

// Analiza un clip individual con visión IA → categoria + título + subtítulo + calidad
async function analyzeClipWithAI(clipFile, clipId) {
  const fd = new FormData();
  fd.append("clip", clipFile);
  try {
    const r = await fetch(API("/analyze-clip"), { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Error en analysis");
    state.clip_analyses[clipId] = j;
    return j;
  } catch (e) {
    console.warn("Clip analysis failed:", e);
    return null;
  }
}

// Sugiere título para un clip simple usando IA visual
async function suggestTitleForSimpleClip(clipId) {
  const c = state.simple_clips.find(x => x.id === clipId);
  if (!c || !c.file) return;
  c._analyzing = true; render();
  const result = await analyzeClipWithAI(c.file, clipId);
  c._analyzing = false;
  if (result && result.suggested_title) {
    c.headline = result.suggested_title;
    c.subline = result.suggested_subtitle || c.subline;
  }
  render();
  setTimeout(initSimpleSortable, 50);
}

// Sugiere título para un clip guiado (de sección)
async function suggestTitleForGuidedClip(sectionKey, clipIndex) {
  const c = state.sections[sectionKey]?.clips?.[clipIndex];
  if (!c || !c.file) return;
  c._analyzing = true; render();
  const result = await analyzeClipWithAI(c.file, c.id);
  c._analyzing = false;
  if (result && result.suggested_title) {
    c.headline = result.suggested_title;
    c.subline = result.suggested_subtitle || c.subline;
  }
  render();
}

// Análisis de calidad global del reel — corre análisis de TODOS los clips
// y después genera el reporte global con recomendaciones
async function runQualityReport() {
  state.quality_loading = true;
  state.quality_report = null;
  render();
  try {
    const clips = state.upload_mode === "simple"
      ? state.simple_clips
      : Object.values(state.sections).flatMap(s => s.clips);

    // Analizar todos los clips en paralelo (max 4 a la vez para no saturar)
    const analyses = [];
    for (let i = 0; i < clips.length; i += 4) {
      const batch = clips.slice(i, i + 4);
      const results = await Promise.all(
        batch.map(c => state.clip_analyses[c.id] ? Promise.resolve(state.clip_analyses[c.id]) : analyzeClipWithAI(c.file, c.id))
      );
      analyses.push(...results.filter(Boolean));
    }
    // Generar reporte global
    const r = await fetch(API("/analyze-quality"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ analyses, property: state.property }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Error en reporte");
    state.quality_report = j;
  } catch (e) {
    alert("No pude generar el reporte: " + e.message);
  } finally {
    state.quality_loading = false;
    render();
  }
}

// ── EDITOR DE SUBTÍTULOS (post-Whisper) ───────────────────────────
async function openSubtitleEditor() {
  if (!state.job_id) { alert("No hay reel cargado"); return; }
  // Loading overlay
  const ov = document.createElement("div");
  ov.id = "subEditOverlay";
  ov.className = "fixed inset-0 bg-black/60 flex items-center justify-center z-50";
  ov.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center">
    <div class="spinner w-8 h-8 border-4 border-slate-200 border-t-slate-900 rounded-full mx-auto mb-3"></div>
    <div class="text-sm text-slate-700">Cargando subtítulos…</div></div>`;
  document.body.appendChild(ov);
  try {
    const url = API(`/jobs/${state.job_id}/subtitles`);
    let r;
    try {
      r = await fetch(url, { method: "GET", cache: "no-store" });
    } catch (netErr) {
      throw new Error(
        "No pude contactar al servidor. Verificá tu conexión y que el reel " +
        "siga disponible (Render puede haber reiniciado). Si el problema sigue, " +
        "tocá '↻ Re-generar reel con cambios' y probá de nuevo."
      );
    }
    ov.remove();
    if (!r.ok) {
      if (r.status === 404) {
        alert("Este reel ya no está disponible en el servidor (probablemente Render reinició). Tocá '↻ Re-generar reel con cambios' para crear uno nuevo y poder editar los subtítulos.");
        return;
      }
      let detail = `HTTP ${r.status}`;
      try { const tx = await r.text(); detail += ` — ${tx.slice(0, 200)}`; } catch (_) {}
      alert("El servidor respondió con error: " + detail);
      return;
    }
    const j = await r.json();
    if (!j.available || !j.segments || j.segments.length === 0) {
      alert((j.hint || "No hay subtítulos transcritos para este reel.") +
            "\n\nAsegurate de tener voz cargada con subtítulos activados, regenerá el reel, y volvé a intentar.");
      return;
    }
    state._sub_segments = JSON.parse(JSON.stringify(j.segments));  // copia
    renderSubtitleEditorModal();
  } catch (e) {
    if (document.getElementById("subEditOverlay")) ov.remove();
    alert(e.message || String(e));
  }
}
