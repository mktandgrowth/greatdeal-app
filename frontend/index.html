<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreatDeal · Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .fade-in { animation: fadeIn .3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .dropzone { transition: all 0.2s; border-style: dashed; }
  .dropzone.drag { background: #dbeafe; border-color: #3b82f6; transform: scale(1.02); }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .step-dot { transition: all 0.2s; }
  .section-card { transition: all 0.2s; }
  .section-card.complete { border-color: #10b981; background: #f0fdf4; }
  .clip-tile.sortable-ghost { opacity: 0.3; }
  .clip-tile.sortable-chosen { transform: scale(1.05); z-index: 10; }
  /* Manual editor */
  .editor-modal { position: fixed; inset: 0; background: rgba(15,23,42,0.97); z-index: 100; overflow-y: auto; }
  .editor-clip.sortable-ghost { opacity: 0.4; background: #1e40af; }
  .editor-clip.sortable-chosen { transform: scale(1.02); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .drag-handle { cursor: grab; touch-action: none; }
  .drag-handle:active { cursor: grabbing; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; background: #475569; border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #fbbf24; border-radius: 50%; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; background: #fbbf24; border-radius: 50%; cursor: pointer; border: none; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform 0.2s; }
  .mode-pill { transition: all 0.2s; }
  .mode-pill.active { background: #0f172a; color: white; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold">G</div>
      <span class="font-bold text-slate-900">GreatDeal</span>
    </div>
    <button onclick="resetAll()" class="text-xs text-slate-500 hover:text-slate-900">Empezar de nuevo</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-5 pb-32">
  <div class="pt-6 mb-6">
    <div class="flex items-center justify-center gap-3" id="stepper"></div>
  </div>
  <div id="step-content"></div>
</main>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-20">
  <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
    <button id="btn-prev" onclick="goPrev()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg disabled:opacity-30">← Volver</button>
    <button id="btn-next" onclick="goNext()" class="px-6 py-3 bg-slate-900 text-white rounded-lg hover:bg-slate-800 disabled:opacity-30 font-medium">Continuar →</button>
  </div>
</div>

<script>
// ──────────────────────────────────────────────────────────────────────────
//  CONFIG
// ──────────────────────────────────────────────────────────────────────────
const STEPS = [
  { id: 1, label: "Videos" },
  { id: 2, label: "Datos" },
  { id: 3, label: "Tu reel" },
];

const SECTION_ORDER = ["exterior", "entrada", "dormitorios", "banos", "areas", "vista"];

const SECTION_CONFIG = {
  exterior: {
    label: "Exterior",
    icon: "🏡",
    description: "Una toma del lugar desde afuera. Mostrá la fachada completa con luz natural.",
    tip: "Celular vertical, distancia que se vea el lugar entero. 3-4 segundos.",
    minClips: 0, maxClips: 1, defaultDuration: 3.5, speed: 1.0,
    defaultHeadline: ""
  },
  entrada: {
    label: "Entrada",
    icon: "🚪",
    description: "Grabá ~15 segundos caminando hacia y entrando al lugar. Lo aceleramos 3x.",
    tip: "Caminá firme y lento, celular vertical. Desde afuera hasta el living.",
    minClips: 0, maxClips: 1, defaultDuration: 15, speed: 3.0,
    defaultHeadline: ""
  },
  dormitorios: {
    label: "Dormitorios",
    icon: "🛏️",
    description: "1 a 5 panorámicas de cada dormitorio. 2.5 segundos cada toma.",
    tip: "Parate en un extremo y barré con el celular hacia el otro lado, fluído. Camas hechas.",
    minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0,
    defaultHeadline: "Dormitorios"
  },
  banos: {
    label: "Baños",
    icon: "🚿",
    description: "1 a 5 tomas cortas de baños. 2.5 seg cada una.",
    tip: "Panorámica o detalle de la grifería. Sin objetos personales (toallas, productos).",
    minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0,
    defaultHeadline: "Baños"
  },
  areas: {
    label: "Áreas comunes",
    icon: "🛋️",
    description: "1 a 5 tomas de living, cocina, terraza, comedor. 2.5 seg cada una.",
    tip: "Ángulos amplios. Encendé luces y abrí cortinas para más luminosidad.",
    minClips: 0, maxClips: 5, defaultDuration: 2.5, speed: 1.0,
    defaultHeadline: "Áreas comunes"
  },
  vista: {
    label: "Vista",
    icon: "🌅",
    description: "Cierre con la vista del lugar. 3 segundos.",
    tip: "Vista exterior (mar, cordillera, ciudad) desde la mejor ventana o terraza.",
    minClips: 0, maxClips: 1, defaultDuration: 3, speed: 1.0,
    defaultHeadline: ""
  },
};

const API_BASE = (() => {
  const host = window.location.hostname;
  if (host === "localhost" || host === "127.0.0.1") return "";
  return window.GREATDEAL_API_URL || "https://greatdeal-api.onrender.com";
})();
const API = (path) => `${API_BASE}/api${path}`;

function calcAutoDuration(numClips) {
  if (numClips === 0) return 3;
  return Math.max(1.8, Math.min(5, 26 / numClips));
}

// ──────────────────────────────────────────────────────────────────────────
//  STATE
// ──────────────────────────────────────────────────────────────────────────
function emptySections() {
  const s = {};
  for (const k of SECTION_ORDER) {
    s[k] = { clips: [], headline: SECTION_CONFIG[k].defaultHeadline };
  }
  return s;
}

let state = {
  step: 1,
  upload_mode: "guided",       // "guided" | "simple"
  sections: emptySections(),   // for guided mode
  simple_clips: [],            // for simple mode (flat list)
  property: {
    tipo: "Casa", comuna: "",
    m2: "", dorms: "", banos: "", precio_uf: "",
  },
  advanced_open: false,
  music_preset: "chill",
  music_file: null,
  music_presets_catalog: [],
  voice_audio_file: null,
  logo_file: null,
  logo_dataUrl: null,
  custom_tagline: "Vivir distinto",
  custom_cta_info: "",
  custom_cta_precio: "",
  job_id: null,
  job_status: null,
  job_log: [],
  job_error: null,
  job_download: null,
  job_duration: null,
  is_reprocessing: false,
  has_been_processed: false,
  editor_open: false,
  editor_clips: [],
  editor_sortable: null,
  simple_sortable: null,
};

function resetAll() {
  if (!confirm("¿Empezar de cero? Se pierden los videos cargados.")) return;
  const catalog = state.music_presets_catalog;
  state = {
    step: 1, upload_mode: "guided", sections: emptySections(), simple_clips: [],
    property: { tipo: "Casa", comuna: "", m2: "", dorms: "", banos: "", precio_uf: "" },
    advanced_open: false,
    music_preset: "chill", music_file: null, music_presets_catalog: catalog,
    voice_audio_file: null, logo_file: null, logo_dataUrl: null,
    custom_tagline: "Vivir distinto", custom_cta_info: "", custom_cta_precio: "",
    job_id: null, job_status: null, job_log: [], job_error: null,
    job_download: null, job_duration: null,
    is_reprocessing: false, has_been_processed: false,
    editor_open: false, editor_clips: [], editor_sortable: null, simple_sortable: null,
  };
  render();
}

async function loadMusicPresets() {
  try {
    const r = await fetch(API("/music-presets"));
    const j = await r.json();
    state.music_presets_catalog = j.presets || [];
  } catch (e) { console.warn("Music presets:", e); }
}

// ──────────────────────────────────────────────────────────────────────────
//  HELPERS
// ──────────────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function totalClipsCount() {
  if (state.upload_mode === "simple") return state.simple_clips.length;
  return SECTION_ORDER.reduce((acc, k) => acc + state.sections[k].clips.length, 0);
}

function switchUploadMode(mode) {
  if (mode === state.upload_mode) return;
  const hasAny = totalClipsCount() > 0;
  if (hasAny) {
    if (!confirm("Si cambiás de modo se pierden los videos cargados. ¿Seguir?")) return;
    state.sections = emptySections();
    state.simple_clips = [];
  }
  state.upload_mode = mode;
  render();
}

// ──────────────────────────────────────────────────────────────────────────
//  STEPPER + NAVIGATION
// ──────────────────────────────────────────────────────────────────────────
function renderStepper() {
  const html = STEPS.map((s, i) => {
    const active = state.step === s.id;
    const done = state.step > s.id;
    return `
      <div class="flex items-center gap-2">
        <div class="step-dot w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold
          ${active ? 'bg-slate-900 text-white' : done ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500'}">
          ${done ? '✓' : s.id}
        </div>
        <span class="text-sm ${active ? 'text-slate-900 font-medium' : 'text-slate-500'}">${s.label}</span>
      </div>
      ${i < STEPS.length - 1 ? '<div class="w-8 h-px bg-slate-300"></div>' : ''}
    `;
  }).join("");
  document.getElementById("stepper").innerHTML = html;

  document.getElementById("btn-prev").disabled = (state.step === 1);
  const next = document.getElementById("btn-next");
  if (state.step === 3) {
    const isProcessing = state.job_status && state.job_status !== "done" && state.job_status !== "error";
    if (isProcessing) { next.textContent = "Procesando…"; next.disabled = true; }
    else if (!state.has_been_processed) { next.textContent = "Generar mi reel →"; next.disabled = false; }
    else { next.textContent = "✓ Listo"; next.disabled = true; }
  } else if (state.step === 2) {
    next.textContent = "Generar mi reel →";
    next.disabled = false;
  } else {
    next.textContent = "Continuar →";
    next.disabled = totalClipsCount() === 0;
  }
}

function goNext() {
  if (state.step === 1) {
    if (totalClipsCount() === 0) { alert("Subí al menos un video"); return; }
  }
  if (state.step === 2) {
    state.step = 3;
    render();
    processReel();
    return;
  }
  if (state.step === 3 && !state.has_been_processed) {
    processReel();
    return;
  }
  if (state.step < STEPS.length) { state.step++; render(); }
}

function goPrev() {
  if (state.step > 1) { state.step--; render(); }
}

// ──────────────────────────────────────────────────────────────────────────
//  STEP 1 — VIDEOS (guided OR simple)
// ──────────────────────────────────────────────────────────────────────────
function renderStep1() {
  const total = totalClipsCount();
  const totalDur = calcAutoDuration(total) * total;

  const modeToggle = `
    <div class="bg-white border border-slate-200 rounded-xl p-1.5 flex gap-1 mb-5 max-w-md mx-auto">
      <button onclick="switchUploadMode('guided')"
              class="mode-pill flex-1 py-2 px-3 rounded-lg text-sm font-medium ${state.upload_mode === 'guided' ? 'active' : 'text-slate-600 hover:bg-slate-100'}">
        🎬 Guiado por tomas
      </button>
      <button onclick="switchUploadMode('simple')"
              class="mode-pill flex-1 py-2 px-3 rounded-lg text-sm font-medium ${state.upload_mode === 'simple' ? 'active' : 'text-slate-600 hover:bg-slate-100'}">
        ⚡ Subir videos existentes
      </button>
    </div>
  `;

  let content;
  if (state.upload_mode === "simple") {
    content = renderSimpleUpload();
  } else {
    content = renderGuidedSections();
  }

  return `
    <div class="fade-in">
      <h1 class="text-2xl font-bold text-slate-900 mb-1 text-center">Tus videos</h1>
      <p class="text-slate-600 mb-5 text-center text-sm">Elegí cómo querés cargar los videos de la propiedad</p>
      ${modeToggle}
      ${content}
    </div>
  `;
}

// — SIMPLE MODE (single dropzone + reorderable grid)
function renderSimpleUpload() {
  const hasClips = state.simple_clips.length > 0;
  const total = state.simple_clips.length;
  const totalDur = calcAutoDuration(total) * total;

  const dropzone = `
    <div class="dropzone bg-white border-2 border-slate-300 rounded-2xl p-8 text-center mb-4"
         ondragover="event.preventDefault(); this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="event.preventDefault(); this.classList.remove('drag'); handleSimpleUpload(event.dataTransfer.files)">
      <div class="text-4xl mb-2">🎬</div>
      <div class="font-medium text-slate-900 mb-1">Arrastrá tus videos o tocá abajo</div>
      <div class="text-sm text-slate-500 mb-4">Podés subir varios a la vez</div>
      <div class="flex flex-wrap justify-center gap-2">
        <label class="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-900 text-white rounded-lg cursor-pointer hover:bg-slate-800 font-medium">
          📤 Subir videos
          <input type="file" accept="video/*" multiple class="hidden"
                 onchange="handleSimpleUpload(event.target.files)">
        </label>
        <label class="inline-flex items-center gap-2 px-5 py-2.5 bg-white border-2 border-slate-900 text-slate-900 rounded-lg cursor-pointer hover:bg-slate-100 font-medium">
          📷 Grabar ahora
          <input type="file" accept="video/*" capture="environment" class="hidden"
                 onchange="handleSimpleUpload(event.target.files)">
        </label>
      </div>
    </div>
  `;

  const grid = hasClips ? `
    <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-medium text-slate-900">
          ${total} video${total !== 1 ? 's' : ''} ·
          <span class="text-slate-500 font-normal">~${Math.round(totalDur)}s de reel + cierre</span>
        </div>
        <div class="text-xs text-slate-400">Arrastrá para reordenar</div>
      </div>
      <div id="simple-clips-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
        ${state.simple_clips.map((c, i) => `
          <div class="clip-tile relative bg-slate-100 rounded-lg overflow-hidden cursor-grab" data-id="${c.id}">
            <video src="${c.dataUrl}" muted playsinline preload="metadata" class="w-full aspect-[9/16] object-cover bg-black"></video>
            <div class="absolute top-1 left-1 bg-black/70 text-white text-xs px-1.5 py-0.5 rounded">${i + 1}</div>
            <button onclick="removeSimpleClip('${c.id}')" class="absolute top-1 right-1 w-6 h-6 bg-red-500 text-white rounded-full text-xs hover:bg-red-600">×</button>
          </div>
        `).join("")}
      </div>
    </div>
  ` : "";

  return dropzone + grid;
}

function handleSimpleUpload(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith("video/"));
  if (arr.length === 0) return;
  let pending = arr.length;
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      state.simple_clips.push({
        id: `s_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        file: f, dataUrl: e.target.result, name: f.name,
      });
      pending--;
      if (pending === 0) {
        render();
        setTimeout(initSimpleSortable, 50);
      }
    };
    reader.readAsDataURL(f);
  });
}

function removeSimpleClip(id) {
  state.simple_clips = state.simple_clips.filter(c => c.id !== id);
  render();
  setTimeout(initSimpleSortable, 50);
}

function initSimpleSortable() {
  const grid = document.getElementById("simple-clips-grid");
  if (!grid || typeof Sortable === "undefined") return;
  if (state.simple_sortable) state.simple_sortable.destroy();
  state.simple_sortable = Sortable.create(grid, {
    animation: 150,
    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen",
    onEnd: (evt) => {
      const moved = state.simple_clips.splice(evt.oldIndex, 1)[0];
      state.simple_clips.splice(evt.newIndex, 0, moved);
      const tiles = grid.querySelectorAll(".clip-tile");
      tiles.forEach((tile, i) => {
        const badge = tile.querySelector("div");
        if (badge) badge.textContent = i + 1;
      });
    }
  });
}

// — GUIDED MODE (sections with tips)
function renderGuidedSections() {
  return `
    <div class="space-y-3">
      ${SECTION_ORDER.map(k => renderSectionCard(k)).join("")}
    </div>
    <div class="mt-5 text-center text-xs text-slate-500">
      Tip: no es obligatorio llenar todas. Con al menos una toma ya podés generar el reel.
    </div>
  `;
}

function renderSectionCard(key) {
  const cfg = SECTION_CONFIG[key];
  const sec = state.sections[key];
  const count = sec.clips.length;
  const complete = count > 0;
  const slotsLeft = cfg.maxClips - count;

  const speedTag = cfg.speed !== 1.0
    ? `<span class="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded-full ml-1">×${cfg.speed}</span>`
    : "";
  const limitTag = `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full ml-1">
    ${cfg.maxClips === 1 ? `1 toma · ${cfg.defaultDuration}s` : `máx ${cfg.maxClips} · ${cfg.defaultDuration}s c/u`}
  </span>`;

  const clipsHtml = sec.clips.length === 0
    ? ""
    : `<div class="flex flex-wrap gap-2 mb-3">
        ${sec.clips.map((c, i) => `
          <div class="relative">
            <video src="${c.dataUrl}" class="w-20 h-28 object-cover rounded-lg bg-black" muted playsinline preload="metadata"></video>
            <button onclick="removeSectionClip('${key}', ${i})" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs hover:bg-red-600">×</button>
          </div>
        `).join("")}
      </div>`;

  const actionButtons = slotsLeft > 0
    ? `<div class="flex flex-wrap gap-2">
        <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 text-white text-xs rounded-lg cursor-pointer hover:bg-slate-800">
          📤 Subir
          <input type="file" accept="video/*" multiple class="hidden"
                 onchange="handleSectionUpload('${key}', event.target.files)">
        </label>
        <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-900 text-slate-900 text-xs rounded-lg cursor-pointer hover:bg-slate-100">
          📷 Grabar
          <input type="file" accept="video/*" capture="environment" class="hidden"
                 onchange="handleSectionUpload('${key}', event.target.files)">
        </label>
      </div>`
    : `<span class="text-xs text-emerald-700 font-medium">✓ Sección completa</span>`;

  return `
    <div class="section-card border-2 ${complete ? 'complete' : 'border-slate-200'} rounded-xl p-4 bg-white">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center flex-wrap">
          <span class="text-xl mr-2">${cfg.icon}</span>
          <h3 class="font-bold text-slate-900">${cfg.label}</h3>
          ${limitTag}
          ${speedTag}
        </div>
        <div class="text-xs ${complete ? 'text-emerald-600' : 'text-slate-400'} font-medium">
          ${count}/${cfg.maxClips}
        </div>
      </div>
      <p class="text-xs text-slate-700 mb-1">${escapeHtml(cfg.description)}</p>
      <p class="text-[11px] text-slate-500 italic mb-3">💡 ${escapeHtml(cfg.tip)}</p>
      ${clipsHtml}
      ${actionButtons}
    </div>
  `;
}

function handleSectionUpload(key, files) {
  const cfg = SECTION_CONFIG[key];
  const sec = state.sections[key];
  const slotsLeft = cfg.maxClips - sec.clips.length;
  const arr = Array.from(files).filter(f => f.type.startsWith("video/")).slice(0, slotsLeft);
  let pending = arr.length;
  if (pending === 0) return;
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      sec.clips.push({
        id: `g_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        file: f, dataUrl: e.target.result, name: f.name,
      });
      pending--;
      if (pending === 0) render();
    };
    reader.readAsDataURL(f);
  });
}

function removeSectionClip(key, idx) {
  state.sections[key].clips.splice(idx, 1);
  render();
}

// ──────────────────────────────────────────────────────────────────────────
//  STEP 2 — DATOS + AVANZADO
// ──────────────────────────────────────────────────────────────────────────
function renderStep2() {
  const p = state.property;
  const presetOptions = state.music_presets_catalog
    .map(pr => `<option value="${pr.key}" ${state.music_preset === pr.key ? 'selected' : ''}>${escapeHtml(pr.label)}</option>`)
    .join("");
  const previewInfo = state.custom_cta_info ||
    `${p.m2 || '—'} m² · ${p.dorms || '—'} dorm · ${p.banos || '—'} baños`;
  const previewPrecio = state.custom_cta_precio ||
    (p.precio_uf ? `Desde ${p.precio_uf} UF` : 'Consultar');

  return `
    <div class="fade-in max-w-2xl mx-auto">
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Datos de la propiedad</h1>
      <p class="text-slate-600 mb-6">Con esto armamos el cierre del reel automáticamente.</p>

      <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-4 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-500 block mb-1">Tipo</label>

// ──────────────────────────────────────────────────────────────────────────
//  PROCESS / REPROCESS
// ──────────────────────────────────────────────────────────────────────────
function buildCtaData() {
  const p = state.property;
  return {
    info: (state.custom_cta_info || "").trim() ||
          `${p.m2 || '—'} m² · ${p.dorms || '—'} dorm · ${p.banos || '—'} baños`,
    precio: (state.custom_cta_precio || "").trim() ||
            (p.precio_uf ? `Desde ${p.precio_uf} UF` : 'Consultar'),
    tagline: (state.custom_tagline || "").trim() || "Vivir distinto",
  };
}

/** Returns {files: [...File], sections: [...]} */
function buildPayload() {
  if (state.upload_mode === "simple") {
    const dur = calcAutoDuration(state.simple_clips.length);
    const files = state.simple_clips.map(c => c.file);
    const sections = [{
      name: "default",
      clips: state.simple_clips.map((_, i) => ({
        file_index: i,
        trim_start: 0,
        trim_duration: dur,
        speed: 1.0,
        headline: "",
        subline: "",
      }))
    }];
    return { files, sections };
  }
  // guided
  const files = [];
  const sections = [];
  for (const key of SECTION_ORDER) {
    const cfg = SECTION_CONFIG[key];
    const sec = state.sections[key];
    if (sec.clips.length === 0) continue;
    const clips = sec.clips.map((c, i) => {
      const fi = files.length;
      files.push(c.file);
      return {
        file_index: fi,
        trim_start: 0,
        trim_duration: cfg.defaultDuration,
        speed: cfg.speed,
        headline: i === 0 ? ((sec.headline || "").trim()) : "",
        subline: "",
      };
    });
    sections.push({ name: key, clips });
  }
  return { files, sections };
}

async function processReel() {
  const { files, sections } = buildPayload();
  if (files.length === 0) {
    alert("No hay videos para procesar");
    state.step = 1; render();
    return;
  }

  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "chill");
  files.forEach(f => fd.append("clips", f));
  if (state.music_file)       fd.append("music",       state.music_file);
  if (state.voice_audio_file) fd.append("voice_audio", state.voice_audio_file);
  if (state.logo_file)        fd.append("logo",        state.logo_file);

  state.job_status = "uploading";
  state.is_reprocessing = false;
  state.has_been_processed = true;
  state.job_error = null;
  state.job_log = [];
  render();

  try {
    const r = await fetch(API("/jobs"), { method: "POST", body: fd });
    if (!r.ok) {
      let detail = `HTTP ${r.status}`;
      try {
        const errBody = await r.text();
        if (errBody) detail += ` — ${errBody.slice(0, 400)}`;
      } catch (_) {}
      throw new Error(detail);
    }
    const j = await r.json();
    state.job_id = j.job_id;
    state.job_status = j.status;
    render();
    pollJobStatus();
  } catch (e) {
    state.job_status = "error";
    state.job_error = e.message || String(e);
    render();
  }
}

async function reprocessFromCurrent() {
  if (!state.job_id) { processReel(); return; }
  if (!confirm("¿Re-procesar el reel con los cambios?")) return;

  const { sections } = buildPayload();
  if (sections.length === 0) { alert("No hay videos"); return; }

  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "chill");

  state.job_status = "reprocessing";
  state.is_reprocessing = true;
  state.job_log = [];
  state.job_error = null;
  state.job_download = null;
  render();

  try {
    const r = await fetch(API(`/jobs/${state.job_id}/reprocess`), { method: "POST", body: fd });
    if (!r.ok) {
      let detail = `HTTP ${r.status}`;
      try {
        const errBody = await r.text();
        if (errBody) detail += ` — ${errBody.slice(0, 400)}`;
      } catch (_) {}
      throw new Error(detail);
    }
    pollJobStatus();
  } catch (e) {
    state.job_status = "error";
    state.job_error = e.message || String(e);
    render();
  }
}

async function pollJobStatus() {
  while (true) {
    await new Promise(r => setTimeout(r, 2500));
    try {
      const r = await fetch(API(`/jobs/${state.job_id}`));
      const j = await r.json();
      state.job_status = j.status;
      state.job_log = j.log || [];
      state.job_error = j.error;
      state.job_duration = j.duration;
      state.job_download = j.download_url ? `${API_BASE}${j.download_url}` : null;
      render();
      if (j.status === "done" || j.status === "error") break;
    } catch (e) { console.warn(e); break; }
  }
}

// ──────────────────────────────────────────────────────────────────────────
//  MANUAL EDITOR (timeline tipo CapCut)
// ──────────────────────────────────────────────────────────────────────────
function openManualEditor() {
  const { files, sections } = buildPayload();
  if (files.length === 0) { alert("No hay clips para editar"); return; }
  // Flat list of clips with metadata
  const editorClips = [];
  let i = 0;
  sections.forEach(s => {
    s.clips.forEach(c => {
      editorClips.push({
        id: `eclip_${i}`,
        fileIndex: c.file_index,
        fileName: files[c.file_index].name,
        dataUrl: URL.createObjectURL(files[c.file_index]),
        trim_start: c.trim_start,
        trim_duration: c.trim_duration,
        speed: c.speed,
        headline: c.headline || "",
        subline: c.subline || "",
        sourceDuration: null,
      });
      i++;
    });
  });
  state.editor_clips = editorClips;
  state.editor_open = true;
  render();
  setTimeout(initEditorSortable, 50);
}

function closeManualEditor() {
  if (state.editor_sortable) { state.editor_sortable.destroy(); state.editor_sortable = null; }
  state.editor_open = false;
  render();
}

function initEditorSortable() {
  const list = document.getElementById("editor-clip-list");
  if (!list || typeof Sortable === "undefined") return;
  state.editor_sortable = Sortable.create(list, {
    handle: ".drag-handle",
    animation: 150,
    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen",
    onEnd: (evt) => {
      const moved = state.editor_clips.splice(evt.oldIndex, 1)[0];
      state.editor_clips.splice(evt.newIndex, 0, moved);
    }
  });
}

function editorUpdateClip(id, field, value) {
  const c = state.editor_clips.find(x => x.id === id);
  if (!c) return;
  c[field] = value;
  const el = document.getElementById(`eff-${id}`);
  if (el) el.textContent = `${(c.trim_duration / c.speed).toFixed(1)}s en pantalla`;
}

function editorDeleteClip(id) {
  if (!confirm("¿Eliminar este clip?")) return;
  state.editor_clips = state.editor_clips.filter(c => c.id !== id);
  render();
  setTimeout(initEditorSortable, 50);
}

function editorMetadataLoaded(id, duration) {
  const c = state.editor_clips.find(x => x.id === id);
  if (!c) return;
  c.sourceDuration = duration;
  if (c.trim_duration > duration) c.trim_duration = duration;
  const slider = document.getElementById(`trim-dur-${id}`);
  if (slider) {
    slider.max = duration.toFixed(2);
    slider.value = c.trim_duration.toFixed(2);
    const lbl = document.getElementById(`trim-dur-lbl-${id}`);
    if (lbl) lbl.textContent = `${c.trim_duration.toFixed(1)}s`;
    const max = document.getElementById(`source-dur-${id}`);
    if (max) max.textContent = `(fuente: ${duration.toFixed(1)}s)`;
  }
}

function renderEditorClip(c, idx) {
  const effDur = (c.trim_duration / c.speed).toFixed(1);
  return `
    <div class="editor-clip bg-slate-800 border border-slate-700 rounded-xl p-4 mb-3" data-id="${c.id}">
      <div class="flex items-start gap-3">
        <div class="drag-handle text-slate-500 text-2xl pt-1 select-none">☰</div>
        <video src="${c.dataUrl}" preload="metadata" muted playsinline
               class="w-20 h-28 object-cover rounded bg-black flex-shrink-0"
               onloadedmetadata="editorMetadataLoaded('${c.id}', this.duration)"></video>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="min-w-0">
              <div class="text-xs text-slate-400">Clip ${idx + 1}</div>
              <div class="text-sm text-white truncate">${escapeHtml(c.fileName)}</div>
            </div>
            <div class="text-right">
              <div class="text-xs text-amber-400 font-semibold" id="eff-${c.id}">${effDur}s en pantalla</div>
              <button onclick="editorDeleteClip('${c.id}')" class="text-xs text-red-400 hover:text-red-300 mt-1">× Eliminar</button>

          </div>

            </div>
            <input type="range" min="0.5" max="4" step="0.25" value="${c.speed}" class="w-full"
                   oninput="this.parentElement.querySelector('#speed-lbl-${c.id}').textContent=parseFloat(this.value).toFixed(1); editorUpdateClip('${c.id}','speed',parseFloat(this.value))">
          </div>
          <div class="mb-2">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span>✂️ Duración <span id="source-dur-${c.id}" class="text-slate-600 text-[10px]">${c.sourceDuration ? `(fuente: ${c.sourceDuration.toFixed(1)}s)` : ''}</span></span>
              <span class="text-white font-mono"><span id="trim-dur-lbl-${c.id}">${c.trim_duration.toFixed(1)}</span>s</span>

            <input type="range" min="0.5" max="${c.sourceDuration || 30}" step="0.1" value="${c.trim_duration}" class="w-full"
                   id="trim-dur-${c.id}"
                   oninput="this.parentElement.querySelector('#trim-dur-lbl-${c.id}').textContent=parseFloat(this.value).toFixed(1); editorUpdateClip('${c.id}','trim_duration',parseFloat(this.value))">
          </div>
          <div class="mb-3">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span>⏱️ Empezar desde</span>
              <span class="text-white font-mono"><span id="trim-start-lbl-${c.id}">${c.trim_start.toFixed(1)}</span>s</span>
            </div>
            <input type="range" min="0" max="${Math.max(0, (c.sourceDuration || 30) - 0.5)}" step="0.1" value="${c.trim_start}" class="w-full"
                   oninput="this.parentElement.querySelector('#trim-start-lbl-${c.id}').textContent=parseFloat(this.value).toFixed(1); editorUpdateClip('${c.id}','trim_start',parseFloat(this.value))">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" placeholder="Título (opcional)" value="${escapeAttr(c.headline)}" maxlength="40"
                   class="px-2 py-1.5 bg-slate-900 border border-slate-700 text-white text-xs rounded"
                   oninput="editorUpdateClip('${c.id}','headline',this.value)">
            <input type="text" placeholder="Subtítulo (opcional)" value="${escapeAttr(c.subline)}" maxlength="50"
                   class="px-2 py-1.5 bg-slate-900 border border-slate-700 text-white text-xs rounded"
                   oninput="editorUpdateClip('${c.id}','subline',this.value)">
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderManualEditor() {
  const totalEffDur = state.editor_clips.reduce((sum, c) => sum + (c.trim_duration / c.speed), 0);
  return `
    <div class="editor-modal">
      <div class="sticky top-0 bg-slate-900 border-b border-slate-700 px-4 py-3 flex items-center justify-between z-10">
        <div>
          <div class="text-white font-bold">🎨 Editor avanzado</div>
          <div class="text-xs text-slate-400">${state.editor_clips.length} clips · ${totalEffDur.toFixed(1)}s + cierre (5s)${state.logo_file ? ' + Logo (2s)' : ''}</div>
        </div>
        <div class="flex gap-2">
          <button onclick="closeManualEditor()" class="px-4 py-2 text-slate-300 hover:text-white text-sm">Cancelar</button>
          <button onclick="applyEditorChanges()" class="px-4 py-2 bg-amber-400 text-slate-900 font-semibold rounded text-sm hover:bg-amber-300">Re-procesar</button>
        </div>
      </div>
      <div class="max-w-3xl mx-auto px-4 py-6">
        <div class="text-xs text-slate-400 mb-4">
          ☰ Arrastrá para reordenar · "En pantalla" = duración tras aplicar velocidad
        </div>
        <div id="editor-clip-list">
          ${state.editor_clips.map((c, i) => renderEditorClip(c, i)).join("")}
        </div>
        ${state.editor_clips.length === 0
          ? '<div class="text-center text-slate-400 py-12">No quedan clips. Cancelá para volver.</div>'
          : ''}
      </div>
    </div>
  `;
}

async function applyEditorChanges() {
  if (state.editor_clips.length === 0) { alert("No hay clips"); return; }
  if (!confirm(`¿Re-procesar con ${state.editor_clips.length} clips? Toma 1-2 minutos.`)) return;

  const sections = [{
    name: "custom",
    clips: state.editor_clips.map(c => ({
      file_index: c.fileIndex,
      trim_start: c.trim_start,
      trim_duration: c.trim_duration,
      speed: c.speed,
      headline: c.headline || "",
      subline: c.subline || "",
    }))
  }];

  const fd = new FormData();
  fd.append("sections", JSON.stringify(sections));
  fd.append("cta_data", JSON.stringify(buildCtaData()));
  fd.append("music_preset", state.music_preset || "chill");

  state.editor_open = false;
  state.job_status = "reprocessing";
  state.is_reprocessing = true;
  state.job_log = [];
  state.job_error = null;
  state.job_download = null;
  render();

  try {
    const r = await fetch(API(`/jobs/${state.job_id}/reprocess`), { method: "POST", body: fd });
    if (!r.ok) {
      let detail = `HTTP ${r.status}`;
      try {
        const errBody = await r.text();
        if (errBody) detail += ` — ${errBody.slice(0, 400)}`;
      } catch (_) {}
      throw new Error(detail);
    }
    pollJobStatus();
  } catch (e) {
    state.job_status = "error";
    state.job_error = e.message || String(e);
    render();
  }
}

// ──────────────────────────────────────────────────────────────────────────
//  MAIN RENDER
// ──────────────────────────────────────────────────────────────────────────
function render() {
  renderStepper();
  const c = document.getElementById("step-content");
  if (state.step === 1) {
    c.innerHTML = renderStep1();
    if (state.upload_mode === "simple") setTimeout(initSimpleSortable, 50);
  }
  if (state.step === 2) c.innerHTML = renderStep2();
  if (state.step === 3) c.innerHTML = renderStep3();

  const existing = document.getElementById("editor-overlay");
  if (state.editor_open) {
    if (existing) existing.remove();
    const div = document.createElement("div");
    div.id = "editor-overlay";
    div.innerHTML = renderManualEditor();
    document.body.appendChild(div);
  } else if (existing) {
    existing.remove();
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  render();
  await loadMusicPresets();
  render();
});
</script>
</body>
</html>
